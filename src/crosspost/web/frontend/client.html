<!DOCTYPE html>
<html lang="ru" class="cp-ux">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Публикации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0f1117;
  --bg-card: #1a1e27;
  --bg-input: #131720;
  --border: #252d3d;
  --text-1: #e8edf5;
  --text-2: #8a9bb5;
  --accent: #3b82f6;
  --accent-h: #2563eb;
  --success: #22c55e;
  --error: #f87171;
  --warn: #f59e0b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-1);
  font-size: 18px;
  line-height: 1.55;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
#root {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}

/* ── Login ── */
.login-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 24px max(16px, env(safe-area-inset-left,0px));
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
}
.login-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-2);
  font-size: 16px;
  font-weight: 500;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  min-height: 48px;
}
.tab-btn.active {
  color: var(--text-1);
  background: var(--bg-card);
}

/* ── Form elements ── */
.field { margin-bottom: 20px; }
.label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
input[type="text"],
input[type="password"],
input[type="datetime-local"],
textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-1);
  font-family: inherit;
  font-size: 18px;
  padding: 14px 16px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  appearance: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 110px; }

/* ── Buttons ── */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  min-height: 56px;
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-h); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost {
  background: none;
  color: var(--accent);
  border: 1px solid var(--border);
  font-size: 16px;
  padding: 12px;
  min-height: 48px;
}
.btn-danger-ghost {
  background: none;
  color: var(--error);
  border: none;
  font-size: 15px;
  padding: 8px;
  min-height: 44px;
  cursor: pointer;
  font-family: inherit;
}

/* ── Media drop area ── */
.media-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 32px 16px;
  text-align: center;
  color: var(--text-2);
  cursor: pointer;
  transition: border-color 0.15s;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.media-area:hover, .media-area.drag { border-color: var(--accent); color: var(--accent); }
.media-area input { display: none; }
.media-preview {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.media-preview img {
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  display: block;
}
.media-preview-name {
  padding: 12px 16px;
  font-size: 15px;
  color: var(--text-2);
}
.media-remove {
  display: inline-block;
  margin-top: 8px;
  color: var(--error);
  font-size: 15px;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  padding: 4px 8px;
  min-height: 44px;
}

/* ── Channels ── */
.channel-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  min-height: 56px;
  cursor: pointer;
}
.channel-item:last-child { border-bottom: none; }
.channel-item input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: var(--accent);
  flex-shrink: 0;
  cursor: pointer;
}
.channel-name { font-size: 17px; }

/* ── When pills ── */
.when-pills { display: flex; gap: 10px; }
.pill {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: none;
  color: var(--text-1);
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  min-height: 48px;
  transition: border-color 0.15s, background 0.15s;
  text-align: center;
}
.pill.active { border-color: var(--accent); background: rgba(59,130,246,.12); color: var(--accent); }

/* ── Success card ── */
.success-card {
  background: var(--bg-card);
  border: 1px solid var(--success);
  border-radius: 16px;
  padding: 36px 24px;
  text-align: center;
  margin-top: 20px;
}
.success-card.unconfirmed { border-color: var(--text-2); }
.success-icon { font-size: 48px; margin-bottom: 12px; }
.success-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.success-sub { color: var(--text-2); margin-bottom: 24px; }

/* ── Error msg ── */
.error-msg {
  color: var(--error);
  font-size: 15px;
  margin-bottom: 12px;
  padding: 12px 14px;
  background: rgba(248,113,113,.1);
  border-radius: 8px;
}

/* ── Post cards ── */
.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.post-meta { font-size: 14px; color: var(--text-2); margin-bottom: 6px; }
.post-text { font-size: 16px; margin-bottom: 10px; word-break: break-word; }
.post-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
}
.badge-blue { background: rgba(59,130,246,.15); color: var(--accent); }
.badge-amber { background: rgba(245,158,11,.15); color: var(--warn); }
.empty-state { color: var(--text-2); text-align: center; padding: 40px 0; }
.cancel-reason { font-size: 14px; color: var(--error); margin-top: 4px; }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

/* ── Header ── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 0;
  margin-bottom: 4px;
}
.app-header-name { font-size: 15px; color: var(--text-2); }
.logout-btn {
  background: none;
  border: none;
  color: var(--text-2);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  padding: 8px;
  min-height: 44px;
}
.logout-btn:hover { color: var(--text-1); }

.section-title { font-size: 14px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; margin-top: 8px; }
.video-warn { font-size: 14px; color: var(--text-2); margin-top: 8px; }
</style>

<body class="cp-client">
<div id="root"></div>
<script src="https://unpkg.com/preact@10.24.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.24.3/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script src="/static/operation-guard.js"></script>
<script src="/static/schedule-time.js"></script>
<script src="/static/editor-targets.js"></script>
<script src="/static/editor-draft.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = preactHooks;
const html = htm.bind(preact.h);

// ── API helpers ────────────────────────────────────────────────────────────────
const api = {
  get: (url) => fetch(url, { credentials: 'include' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
  post: (url, body) => fetch(url, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }),
  postForm: (url, fd, headers) => fetch(url, { method: 'POST', credentials: 'include', body: fd, headers }),
  del: (url) => fetch(url, { method: 'DELETE', credentials: 'include' }),
  patch: (url, body, extraHeaders = {}) => fetch(url, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...extraHeaders },
    body: JSON.stringify(body)
  }),
};

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}

// ── Login ──────────────────────────────────────────────────────────────────────
function LoginView({ onLogin }) {
  const [login, setLogin] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (busy) return;
    setBusy(true); setErr('');
    try {
      const r = await api.post('/api/auth/login', { login, password });
      if (r.status === 401) { setErr('Неверный логин или пароль'); return; }
      if (!r.ok) { setErr('Что-то пошло не так. Попробуйте ещё раз.'); return; }
      const user = await r.json();
      if (user.role === 'admin') { window.location = '/'; return; }
      onLogin(user);
    } catch { setErr('Нет связи. Проверьте интернет.'); }
    finally { setBusy(false); }
  }

  return html`
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-title">Войти</div>
        <form onSubmit=${submit}>
          <div class="field">
            <label class="label">Логин</label>
            <input type="text" value=${login} onInput=${e => setLogin(e.target.value)} autocomplete="username" autocapitalize="none" required />
          </div>
          <div class="field">
            <label class="label">Пароль</label>
            <input type="password" value=${password} onInput=${e => setPassword(e.target.value)} autocomplete="current-password" required />
          </div>
          ${err && html`<div class="error-msg">${err}</div>`}
          <button type="submit" class="btn btn-primary" disabled=${busy}>
            ${busy ? html`<span class="spinner"></span>` : null}
            Войти
          </button>
        </form>
      </div>
    </div>
  `;
}

// Read the scoped policy before displaying actions. Unknown policy is fail-closed.
function useModeration(pid) {
  const [enabled, setEnabled] = useState(null);
  const [failed, setFailed] = useState(false);
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    let active = true;
    setEnabled(null); setFailed(false);
    api.get(`/api/profiles/${pid}/settings/moderation`)
      .then(data => {
        if (!active) return;
        if (typeof data.enabled !== 'boolean') { setFailed(true); return; }
        setEnabled(data.enabled);
      })
      .catch(() => { if (active) setFailed(true); });
    return () => { active = false; };
  }, [pid, attempt]);
  return { enabled, failed, reload: () => { setEnabled(null); setAttempt(x => x + 1); } };
}

async function actionError(response, fallback) {
  try {
    const body = await response.json();
    if (typeof body.detail === 'string') return body.detail;
  } catch {}
  return fallback;
}

function useScheduleZone(pid) {
  const [zone, setZone] = useState(null);
  useEffect(() => {
    let active = true;
    setZone(null);
    window.CrosspostTime.get(`/api/profiles/${pid}`).then(z => { if (active) setZone(z); })
      .catch(() => { if (active) setZone(null); });
    return () => { active = false; };
  }, [pid]);
  return zone;
}

// ── Compose ────────────────────────────────────────────────────────────────────
function ComposeView({ user }) {
  const pid = user.profile_id;
  const zone = useScheduleZone(pid);
  const policy = useModeration(pid);
  const ops = window.CrosspostOperations;
  const opScope = ops.scope(user, pid);
  const [pending, setPending] = useState(() => ops.pending(opScope));
  const [receipt, setReceipt] = useState(null);
  async function checkOperation() {
    if (submitting.current) return;
    setErr('');
    try { setReceipt(await ops.recover(opScope, `/api/profiles/${pid}`)); }
    catch (e) { setErr(e.message); }
  }
  async function acknowledgeOperation() {
    const matched = draft.markRecovered(receipt);
    await ops.acknowledge(opScope, receipt);
    setPending(ops.pending(opScope)); setReceipt(null);
    if (!matched) draft.reload();
  }
  const [mediaFile, setMediaFile] = useState(null);
  const [mediaPreview, setMediaPreview] = useState(null); // data URL for images
  const [text, setText] = useState('');
  const [targets, setTargets] = useState([]);
  const [checked, setChecked] = useState({});
  const [targetState, setTargetState] = useState('loading');
  const [removedTargets, setRemovedTargets] = useState([]);
  const targetFence = useRef(window.CrosspostEditorTargets.latest());
  const mediaFence = useRef(window.CrosspostEditorTargets.latest());
  const checkedRef = useRef({});
  const [when, setWhen] = useState('now'); // 'now' | 'later'
  const [scheduledAt, setScheduledAt] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [success, setSuccess] = useState(null); // {msg, sub}
  const submitting = useRef(false);
  const fileInputRef = useRef();
  const [mediaMissing, setMediaMissing] = useState(false);
  const draft = window.CrosspostDraft.useDraft({useState,useRef,useEffect}, {
    base: `/api/profiles/${pid}`, actor: user.id, paused: busy || !!success, mediaIdentity: mediaFile,
    data: {text, targets: Object.keys(checked).filter(k => checked[k]), when, scheduled_at: scheduledAt, media_required: !!mediaFile || mediaMissing},
    hydrate: value => {
      setText(value.text); setWhen(policy.enabled ? 'later' : value.when); setScheduledAt(value.scheduled_at);
      replaceChecked(Object.fromEntries(value.targets.map(k => [k,true])));
      mediaFence.current.invalidate(); setMediaFile(null); setMediaPreview(null); setMediaMissing(value.media_required);
    }
  });

  useEffect(() => { if (policy.enabled === true && draft.loaded) setWhen('later'); }, [policy.enabled, draft.loaded]);
  const isVideo = mediaFile && mediaFile.type.startsWith('video/');

  const targetKey = t => t.target_id ? `${t.channel}::${t.target_id}` : t.channel;
  function replaceChecked(value) { checkedRef.current = value; setChecked(value); }
  async function loadTargets(hasVid) {
    if (!pid) return;
    const current = targetFence.current.begin();
    setTargetState('loading');
    try {
      const ts = await api.get(
        `/api/profiles/${pid}/publish/targets?content_type=post&has_video=${hasVid ? 'true' : 'false'}`
      );
      if (!current()) return;
      if (!Array.isArray(ts)) throw new Error('invalid targets');
      const keys = Object.keys(checkedRef.current).filter(k => checkedRef.current[k]);
      const result = window.CrosspostEditorTargets.intersection(keys, ts, targetKey);
      replaceChecked(Object.fromEntries(result.retained.map(k => [k, true])));
      setRemovedTargets(result.removed.map(k => {
        const t = ts.find(t => targetKey(t) === k);
        return k + ': ' + (t?.reason || t?.ineligible_reason || 'цель недоступна');
      }));
      setTargets(ts);
      setTargetState('ready');
    } catch {
      if (current()) setTargetState('error');
    }
  }

  useEffect(() => {
    if (draft.loaded) loadTargets(isVideo);
    return () => targetFence.current.invalidate();
  }, [pid, isVideo, draft.loaded]);
  useEffect(() => () => mediaFence.current.invalidate(), []);

  function pickFile(f) {
    if (!f) return;
    const current = mediaFence.current.begin();
    targetFence.current.invalidate();
    setTargetState('loading');
    setMediaFile(f);
    setMediaMissing(false);
    setMediaPreview(null);
    if (f.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = e => { if (current()) setMediaPreview(e.target.result); };
      r.readAsDataURL(f);
    }
    // Every new file rechecks targets, even if its media type is unchanged.
    loadTargets(f.type.startsWith('video/'));
  }

  function clearMedia() {
    mediaFence.current.invalidate();
    setMediaFile(null); setMediaPreview(null); setMediaMissing(false);
    loadTargets(false);
  }

  function toggleChannel(key) {
    if (targetState !== 'ready') return;
    replaceChecked({ ...checkedRef.current, [key]: !checkedRef.current[key] });
  }

  const eligibleTargets = targets.filter(t => t.eligible);
  const previewRef=window.CrosspostEditorPreview.usePreview({useRef,useEffect},{
    text,media:mediaMissing?"missing":isVideo?"video":mediaFile?"image":"none",
    targets:eligibleTargets.filter(t=>checked[targetKey(t)]).map(t=>({title:t.title,channel:t.channel})),targetState
  });
  const hiddenVideoCount = targets.filter(t => !t.eligible && t.ineligible_kind === 'content' && isVideo).length;

  function buildChannelsList() {
    const allowed = new Set(eligibleTargets.map(targetKey));
    return Object.entries(checked)
      .filter(([key, v]) => v && allowed.has(key))
      .map(([key]) => {
        const [channel, target_id] = key.split('::');
        return target_id ? { channel, target_id } : channel;
      });
  }

  async function submit() {
    if (policy.enabled === null) return;
    if (policy.enabled && when !== 'later') { setWhen('later'); return; }
    if (submitting.current || busy || ops.pending(opScope) || targetState !== 'ready' || !draft.canSend || mediaMissing) { setPending(ops.pending(opScope)); return; }
    setErr('');
    const channelsList = buildChannelsList();
    if (channelsList.length === 0) { setErr('Выберите хотя бы один канал'); return; }
    if (when === 'later' && !scheduledAt) { setErr('Укажите дату и время публикации'); return; }

    const submittedDraft = draft.capture();
    if (!submittedDraft) return;
    submitting.current = true;
    setBusy(true);
    try {
      const fd = new FormData();
      fd.append('content_type', 'post');
      fd.append('text', text);
      fd.append('channels', JSON.stringify(channelsList));
      if (mediaFile) fd.append('media', mediaFile, mediaFile.name);

      if (when === 'now') {
        const result = await ops.run(opScope, async headers => {
          const r = await api.postForm(`/api/profiles/${pid}/publish`, fd, headers);
          if (!r.ok) {
            if (r.status === 403) policy.reload();
            throw new Error(await actionError(r, 'Отправка не подтверждена. Проверьте исходную операцию.'));
          }
          const value = await r.json();
          if (!value.publication_id || !Array.isArray(value.outcomes) || !value.outcomes.length)
            throw new Error('Результат неизвестен.');
          return value;
        }, ops.publicationExpectation(channelsList), submittedDraft);
        draft.markRecorded(submittedDraft);
        const feedback = publicationFeedback(result.outcomes || []);
        if (feedback.error) { setErr(feedback.error); return; }
        if (window.CrosspostDraft.confirmed(result.outcomes)) {
          if (await draft.clearSubmitted(submittedDraft)) {
            await ops.complete(opScope, result);
            setSuccess({...feedback, cleared:true});
          }
          else setErr('Публикация подтверждена. Черновик не очищен: проверьте изменения перед новой отправкой.');
        } else {
          setErr('Результат не подтверждён полностью. Черновик сохранён. Проверьте публикации, не отправляйте повторно.');
        }
      } else {
        const instant = await window.CrosspostTime.resolve(`/api/profiles/${pid}`, scheduledAt, zone);
        fd.append('scheduled_at', instant);
        const post = await ops.run(opScope, async headers => {
          const r = await api.postForm(`/api/profiles/${pid}/scheduled`, fd, {...headers, 'X-Schedule-Time-Contract': 'utc-v1'});
          if (!r.ok) throw new Error('Создание поста не подтверждено. Проверьте операцию.');
          const value = await r.json();
          if (!value.id) throw new Error('Результат неизвестен.');
          return value;
        }, {kind:"scheduled"}, submittedDraft);
        draft.markRecorded(submittedDraft);
        if (!post.id || !['scheduled','pending_approval'].includes(post.status)) { setErr('Создание поста не подтверждено. Черновик сохранён.'); return; }
        const feedback = post.status === 'pending_approval'
          ? { msg: 'Пост отправлен на проверку.', sub: 'Мы опубликуем его, как только проверим.' }
          : { msg: `Пост выйдет ${window.CrosspostTime.label(post.scheduled_at, zone)}.`, sub: '' };
        if (await draft.clearSubmitted(submittedDraft)) {
          await ops.complete(opScope, post);
          setSuccess({...feedback, cleared:true});
        }
        else setErr('Пост создан. Черновик не очищен: проверьте изменения перед новой отправкой.');
      }
    } catch (e) { setErr(e.message || 'Результат неизвестен. Проверьте операцию.'); }
    finally { setPending(ops.pending(opScope)); setBusy(false); submitting.current = false; }
  }

  function reset() {
    mediaFence.current.invalidate();
    setMediaFile(null); setMediaPreview(null);
    setText(''); setWhen(policy.enabled ? 'later' : 'now'); setScheduledAt(''); setMediaMissing(false); replaceChecked({});
    setErr(''); setSuccess(null);
  }

  if (!draft.loaded) return html`<div role="status">${draft.label} ${draft.status !== 'loading' && html`<button class="btn btn-ghost" onClick=${draft.retry}>Повторить</button>`}</div>`;

  if (success) return html`
    <div class=${`success-card${success.unconfirmed ? ' unconfirmed' : ''}`}>
      <div class="success-icon">${success.unconfirmed ? '…' : '✓'}</div>
      <div class="success-title">${success.unconfirmed ? '' : 'Готово! '}${success.msg}</div>
      ${success.sub && html`<div class="success-sub">${success.sub}</div>`}
      <button class="btn btn-primary" onClick=${reset}>Новый пост</button>
    </div>
  `;

  return html`
    <div>
      <p role="status">${draft.label} ${["conflict","save-error","auth"].includes(draft.status) && html`<button class="btn btn-ghost" onClick=${draft.retry}>Проверить сохранение</button>`}</p>
      ${draft.status === 'rejected' && !pending && html`<button class="btn btn-ghost" onClick=${draft.renewRejected}>Продолжить редактирование</button>`}
      ${draft.status === 'recorded' && !pending && html`<button class="btn btn-ghost" onClick=${draft.startNew}>Новый пост</button>`}
      ${mediaMissing && html`<div class="video-warn">Медиа не восстановлено. Выберите файл заново или явно удалите вложение. <button class="btn btn-ghost" onClick=${clearMedia}>Без вложения</button></div>`}
      <div class="field">
        <label class="label">Фото или видео</label>
        ${!mediaFile ? html`
          <div class="media-area" onClick=${() => fileInputRef.current.click()}>
            <span style="font-size:32px">📎</span>
            <span>Добавьте фото или видео</span>
            <span style="font-size:14px; color:var(--text-2)">Нажмите, чтобы выбрать</span>
            <input ref=${fileInputRef} type="file" accept="image/*,video/*" capture="environment"
              onChange=${e => pickFile(e.target.files[0])} />
          </div>
        ` : html`
          <div>
            ${mediaPreview
              ? html`<div class="media-preview"><img src=${mediaPreview} alt="" /></div>`
              : html`<div class="media-preview"><div class="media-preview-name">🎬 ${mediaFile.name}</div></div>`
            }
            <button class="media-remove" onClick=${clearMedia}>Удалить</button>
          </div>
        `}
      </div>

      <div class="field">
        <label class="label">Текст поста</label>
        <textarea rows="4" placeholder="Напишите текст поста…"
          value=${text} onInput=${e => setText(e.target.value)} />
      </div>

      ${targetState === 'loading' && html`<p role="status">Проверяем доступные каналы…</p>`}
      ${targetState === 'error' && html`<div class="error-msg">Не удалось загрузить каналы. <button class="btn btn-ghost" onClick=${() => loadTargets(isVideo)}>Повторить</button></div>`}
      ${targetState === 'ready' && eligibleTargets.length === 0 && html`<p>Нет доступных каналов.</p>`}
      ${removedTargets.length > 0 && html`<p class="video-warn">Исключены: ${removedTargets.join('; ')}</p>`}
      ${eligibleTargets.length > 0 && html`
        <div class="field">
          <label class="label">Куда опубликовать</label>
          <div>
            ${eligibleTargets.map(t => {
              const key = t.target_id ? `${t.channel}::${t.target_id}` : t.channel;
              const label = t.target_name ? `${t.title} · ${t.target_name}` : t.title;
              return html`
                <label key=${key} class="channel-item" style="cursor:pointer">
                  <input type="checkbox" checked=${!!checked[key]} onChange=${() => toggleChannel(key)} />
                  <span class="channel-name">${label}</span>
                </label>
              `;
            })}
          </div>
          ${hiddenVideoCount > 0 && html`
            <p class="video-warn">Некоторые каналы недоступны для видео — мы их скрыли.</p>
          `}
        </div>
      `}

      <div class="field">
        <label class="label">Когда</label>
        <div class="when-pills">
          ${policy.enabled === false && html`<button class=${'pill' + (when === 'now' ? ' active' : '')} onClick=${() => setWhen('now')}>Сейчас</button>`}
          <button class=${'pill' + (when === 'later' ? ' active' : '')} onClick=${() => setWhen('later')}>Выбрать дату и время</button>
        </div>
        ${when === 'later' && html`
          <div style="margin-top:12px">
            <p class="video-warn">${zone ? `Часовой пояс: ${zone}` : "Попросите администратора настроить часовой пояс профиля."}</p>
            <input type="datetime-local" value=${scheduledAt} onInput=${e => setScheduledAt(e.target.value)} />
          </div>
        `}
      </div>

      ${err && html`<div class="error-msg">${err}</div>`}

      ${pending && html`<div class="field" role="status">
        <p>Есть незавершённая операция. Повторная отправка заблокирована.</p>
        <button class="btn btn-ghost" onClick=${checkOperation} disabled=${busy}>Проверить результат</button>
        ${receipt && html`<p>${receipt.message}</p>`}
        ${receipt?.known && html`<button class="btn btn-ghost" onClick=${acknowledgeOperation}>Результат проверен</button>`}
      </div>`}
      ${policy.enabled === true && html`<p class="video-warn">Пост будет отправлен на проверку администратору. Укажите желаемое время.</p>`}
      ${policy.enabled === null && html`<p class="video-warn">${policy.failed ? "Не удалось получить правила публикации." : "Проверяем правила публикации…"} ${policy.failed && html`<button class="btn btn-ghost" onClick=${policy.reload}>Повторить проверку</button>`}</p>`}
      <details ref=${previewRef} class="cp-panel cp-editor-preview"></details>
      <button class="btn btn-primary" onClick=${submit} disabled=${busy || pending || policy.enabled === null || (when === 'later' && !zone) || !draft.canSend || mediaMissing || targetState !== 'ready' || !buildChannelsList().length}>
        ${busy ? html`<span class="spinner"></span>` : null}
        ${busy ? 'Отправляем…' : policy.enabled ? 'На проверку' : when === 'later' ? 'Запланировать' : 'Отправить'}
      </button>
    </div>
  `;
}

function publicationFeedback(outcomes) {
  if (outcomes.some(o => o.status === 'failed' || o.status === 'needs_relogin')) {
    return { error: 'Некоторые каналы не приняли публикацию. Проверьте результаты у администратора.' };
  }
  const unconfirmed = outcomes.length === 0 || outcomes.some(o => o.status !== 'done');
  return { unconfirmed,
    msg: unconfirmed ? 'Отправлено, подтверждение недоступно' : 'Пост опубликован.',
    sub: unconfirmed ? 'Проверьте публикацию в выбранных каналах.' : '' };
}

// ── My Posts ───────────────────────────────────────────────────────────────────
function PostCard({ post, onCancel, canEdit, zone }) {
  const [editing, setEditing] = useState(false);
  const [newTime, setNewTime] = useState('');
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [err, setErr] = useState('');
  const pid = post.profile_id; // not present in ScheduledOut — passed via closure

  const badge = post.status === 'scheduled'
    ? html`<span class="badge badge-blue">Запланировано</span>`
    : post.status === 'pending_approval'
    ? html`<span class="badge badge-amber">На проверке у администратора</span>`
    : null;

  return html`
    <div class="post-card">
      <div class="post-meta">${window.CrosspostTime.label(post.scheduled_at, zone)}</div>
      ${badge}
      ${post.reject_reason && html`<div class="cancel-reason">Причина: ${post.reject_reason}</div>`}
      <div class="post-text">${post.text.slice(0, 80)}${post.text.length > 80 ? '…' : ''}</div>
      ${editing && canEdit && post.status === 'scheduled' ? html`
        <div style="margin-bottom:10px">
          <p>${zone || "Часовой пояс не настроен"}</p>
          <input type="datetime-local" value=${newTime} onInput=${e => setNewTime(e.target.value)}
            style="width:100%; margin-bottom:8px" />
          <div style="display:flex; gap:8px">
            <button class="btn btn-primary" style="flex:1; font-size:15px; padding:10px"
              onClick=${async () => {
                if (!newTime) return;
                try {
                  const instant = await window.CrosspostTime.resolve(`/api/profiles/${post._pid}`, newTime, zone);
                  const r = await api.patch(`/api/profiles/${post._pid}/scheduled/${post.id}`,
                    { scheduled_at: instant }, {'X-Schedule-Time-Contract': 'utc-v1'});
                  if (r.ok) { onCancel(post.id, 'patched'); setEditing(false); }
                  else setErr('Не удалось изменить время.');
                } catch (e) { setErr(e.message); }
              }}>Сохранить</button>
            <button class="btn btn-ghost" style="flex:1; font-size:15px; padding:10px"
              onClick=${() => setEditing(false)}>Отмена</button>
          </div>
        </div>
      ` : null}
      ${err && html`<div class="error-msg" style="margin-bottom:8px">${err}</div>`}
      <div class="post-actions">
        ${!editing && canEdit && post.status === 'scheduled' && html`
          <button class="btn btn-ghost" style="flex:1; font-size:15px; padding:10px; min-height:44px"
            onClick=${() => { setEditing(true); setNewTime(''); }}>
            Изменить время
          </button>
        `}
        ${!confirmCancel ? html`
          <button class="btn-danger-ghost" onClick=${() => setConfirmCancel(true)}>Отменить</button>
        ` : html`
          <div style="display:flex; gap:8px; align-items:center; flex:1">
            <span style="font-size:14px; color:var(--text-2)">Отменить публикацию?</span>
            <button class="btn-danger-ghost" onClick=${async () => {
              try {
                const r = await api.del(`/api/profiles/${post._pid}/scheduled/${post.id}`);
                if (r.ok) onCancel(post.id, 'deleted');
                else setErr(await actionError(r, 'Не удалось отменить публикацию.'));
              } catch { setErr('Нет связи.'); }
              setConfirmCancel(false);
            }}>Да</button>
            <button class="btn-danger-ghost" style="color:var(--text-2)"
              onClick=${() => setConfirmCancel(false)}>Нет</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function PostsView({ user }) {
  const pid = user.profile_id;
  const zone = useScheduleZone(pid);
  const policy = useModeration(pid);
  const [posts, setPosts] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);

  async function load() {
    setLoading(true); setError(false);
    try {
      const data = await api.get(`/api/profiles/${pid}/scheduled`);
      setPosts(data.map(p => ({ ...p, _pid: pid })));
    } catch { setError(true); }
    finally { setLoading(false); }
  }

  useEffect(() => { load(); }, [pid]);

  function handleAction(id, action) {
    if (action === 'deleted') {
      setPosts(prev => prev.filter(p => p.id !== id));
    } else {
      load(); // re-fetch on patch
    }
  }

  if (loading) return html`<div class="empty-state"><span class="spinner" style="margin:0 auto; display:block"></span></div>`;
  if (error) return html`<div class="cp-panel cp-stack"><p>Не удалось загрузить расписание.</p><button class="cp-button" onClick=${load}>Повторить загрузку</button></div>`;
  if (!posts || posts.length === 0) return html`<div class="empty-state">Запланированных публикаций пока нет</div>`;

  return html`
    <div>
      <div class="section-title">Ближайшие</div>
      ${posts.map(p => html`<${PostCard} key=${p.id} post=${p} onCancel=${handleAction} canEdit=${policy.enabled === false && !!zone} zone=${zone} />`)}
    </div>
  `;
}

// ── App ────────────────────────────────────────────────────────────────────────
const CalendarPanel=window.CrosspostCalendarView.create(preact.h,{useState,useEffect});
const HistoryPanel=window.CrosspostHistoryView.create(preact.h,{useState,useEffect,useRef});
function ClientSchedule({user,onNavigate}) {
  const [manage,setManage]=useState(false);
  return manage?html`<section class="cp-stack"><button class="cp-button" onClick=${()=>setManage(false)}>К календарю</button><${PostsView} user=${user} /></section>`:
    html`<${CalendarPanel} pid=${user.profile_id} onCreate=${()=>onNavigate("compose")} onManage=${()=>setManage(true)} />`;
}
const CLIENT_ITEMS = Object.freeze([
  {id:"home",label:"Главная",icon:"home"},
  {id:"compose",label:"Новый пост",icon:"posts"},
  {id:"posts",label:"Расписание",icon:"calendar"},
  {id:"more",label:"Ещё",icon:"more"},
]);
const CLIENT_ROUTES = Object.freeze([...CLIENT_ITEMS.map(i=>i.id),"history"]);
function ClientNavigation({tab,onNavigate,mobile=false}) {
  const ref = window.CrosspostWorkspace.useMenu({useRef,useEffect},CLIENT_ITEMS,tab==="history"?"more":tab,onNavigate,
    mobile ? "Мобильное меню клиента" : "Меню клиента",mobile);
  return html`<div ref=${ref} class=${mobile?"cp-client-mobile":"cp-client-menu"}></div>`;
}
function ClientHome({user,onNavigate}) {
  const overview=window.CrosspostOverview.useOverview({useState,useEffect},user.profile_id);
  const data=overview.data;
  return html`<section class="cp-stack"><h1 class="cp-title">Главная</h1>
    <div class="cp-panel cp-stack"><h2>${user.login}</h2>
      <p class="cp-muted">Подготовьте публикацию или откройте расписание.</p>
      <button class="cp-button cp-button--primary" onClick=${()=>onNavigate("compose")}>Создать пост</button>
      <button class="cp-button" onClick=${()=>onNavigate("posts")}>Открыть расписание</button>
    </div>
    <div class="cp-panel cp-stack" aria-live="polite">
      <h2>Активное расписание</h2>
      ${overview.kind==="loading"?html`<p>Загружаем расписание…</p>`:
        overview.kind==="error"?html`<p>Не удалось загрузить сводку.</p><button class="cp-button" onClick=${overview.retry}>Повторить загрузку</button>`:
        data?html`<div class="cp-overview-metrics">
          <div><strong>${data.scheduled}</strong><span>Запланировано</span></div>
          <div><strong>${data.pending}</strong><span>На проверке</span></div>
        </div>
        ${data.rows.length?html`<h3>Первые записи расписания</h3>${data.rows.slice(0,3).map(row=>html`
          <div class="cp-overview-row" key=${row.id}>
            <small>${window.CrosspostOverview.timeLabel(row,data.zone)}</small>
            <strong>${row.text.slice(0,120)||"Пост без текста"}</strong>
            <span class="cp-muted">${row.status==="scheduled"?"Запланировано":"На проверке"}</span>
          </div>`)}`:html`<p class="cp-muted">Активных публикаций нет.</p>`}`:null}
    </div></section>`;
}
function ClientMore({user,onLogout,onNavigate}) {
  return html`<section class="cp-stack"><h1 class="cp-title">Ещё</h1>
    <div class="cp-panel cp-stack"><p>Аккаунт: ${user.login}</p>
      <p class="cp-muted">Для изменения подключений обратитесь к администратору.</p>
      <button class="cp-button" onClick=${()=>onNavigate("history")}>История</button>
      <button class="cp-button" onClick=${onLogout}>Выйти из аккаунта</button>
    </div></section>`;
}
function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [tab, setTab] = useState('compose');
  const navigation = window.CrosspostWorkspace.useHistory({useRef,useEffect},!!user,"compose",CLIENT_ROUTES,setTab);

  useEffect(() => {
    api.get('/api/auth/me')
      .then(u => {
        if (u.role === 'admin') { window.location = '/'; return; }
        setUser(u);
      })
      .catch(() => {})
      .finally(() => setChecking(false));
  }, []);

  async function logout() {
    if (!window.CrosspostDraft.canLeave()) return;
    await api.post('/api/auth/logout', {});
    navigation.replaceContext("compose");
    setUser(null);
  }

  const navigate = navigation.navigate;

  if (checking) return html`
    <div style="display:flex; align-items:center; justify-content:center; min-height:100dvh">
      <span class="spinner"></span>
    </div>
  `;

  if (!user) return html`<${LoginView} onLogin=${setUser} />`;

  return html`
    <div class="app-wrap">
      <div class="app-header">
        <div><div class="cp-brand">Crosspost</div><span class="app-header-name">${user.login}</span></div>
        <div class="cp-header-actions">
          <select class="cp-theme-select" aria-label="Тема оформления" data-cp-theme-select="" value=${window.CrosspostPageTheme.preference} onChange=${e => window.CrosspostPageTheme.set(e.target.value)}>
            <option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option>
          </select>
          <button class="logout-btn" onClick=${logout}>Выйти</button>
        </div>
      </div>
      <${ClientNavigation} tab=${tab} onNavigate=${navigate} />
      ${tab === 'compose'
        ? html`<${ComposeView} key=${`${user.id}:${user.profile_id}`} user=${user} />`
        : tab === 'posts' ? html`<${ClientSchedule} key=${user.profile_id} user=${user} onNavigate=${navigate} />`
        : tab === 'home' ? html`<${ClientHome} user=${user} onNavigate=${navigate} />`
        : tab === 'history' ? html`<${HistoryPanel} key=${user.profile_id} pid=${user.profile_id} />`
        : html`<${ClientMore} user=${user} onLogout=${logout} onNavigate=${navigate} />`}
      <${ClientNavigation} tab=${tab} onNavigate=${navigate} mobile=${true} />
    </div>
  `;
}

preact.render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
