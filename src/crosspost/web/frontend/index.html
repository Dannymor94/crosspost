}

function OutcomeCard({ o, onRetry, retrying }) {
  const meta = OUTCOME_META[o.status] || { cls: "info", label: o.status };
  const canRetry = o.status === "failed" || o.status === "needs_relogin";
  // Telegraph: external_id — это URL статьи (квитанция). Показываем ссылкой, а не id.
  const articleUrl = o.channel === "telegraph" && o.external_id && /^https?:\/\//.test(o.external_id)
    ? o.external_id : null;
  // Временная ссылка на канал приходит только в ответе публикации (в БД её нет),
  // поэтому доступна сразу после отправки, но не после перезагрузки страницы.
  return h("div", { className: `outcome ${meta.cls}` },
    h("div", { className: "outcome-head" },
      o.url
        ? h("a", { className: "outcome-ch mono outcome-link", href: o.url,
            target: "_blank", rel: "noopener noreferrer",
            title: "Открыть канал в новой вкладке" }, o.channel, " ↗")
        : h("span", { className: "outcome-ch mono" }, o.channel),
      h("span", { className: `outcome-badge ${meta.cls}` }, meta.label),
    ),
    articleUrl && h("a", {
      className: "btn btn-ghost btn-sm mt-2", href: articleUrl,
      target: "_blank", rel: "noopener noreferrer",
    }, "↗ Статья создана"),
    !articleUrl && o.external_id && h("div", { className: "outcome-id mono" }, `id: ${o.external_id}`),
    o.error && h("div", { className: "outcome-err" }, o.error),
    o.url && h("a", {
      className: "btn btn-ghost btn-sm mt-2", href: o.url,
      target: "_blank", rel: "noopener noreferrer",
    }, "↗ Открыть канал"),
    canRetry && h("button", {
      className: "btn btn-ghost btn-sm mt-2", onClick: () => onRetry(o.channel), disabled: retrying,
    }, retrying ? h(Spinner) : null, retrying ? " Повторяю…" : "Повторить только его"),
  );
}

function ScheduleModal({ onClose, onConfirm }) {
  const now = new Date(Date.now() + 3600_000);
  const pad = (n) => String(n).padStart(2, "0");
  const local = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const [when, setWhen] = useState(local);
  return h(Modal, { title: "Запланировать публикацию", onClose },
    h("div", { className: "form-group" },
      h("label", { className: "form-label", htmlFor: "sched-when" }, "Дата и время"),
      h("input", { id: "sched-when", className: "form-input", type: "datetime-local",
        value: when, onChange: (e) => setWhen(e.target.value) }),
      h("p", { className: "form-hint" }, "Пост уйдёт сам в указанное время (местное). Планировщик публикует по расписанию."),
    ),
    h("div", { className: "flex-gap mt-2" },
      h("button", { className: "btn btn-primary", onClick: () => onConfirm(when), disabled: !when }, "Сохранить в план"),
      h("button", { className: "btn btn-ghost", onClick: onClose }, "Отмена"),
    ),
  );
}

function PublishView({ profile }) {
  const [text, setText] = useState("");
  const [articleText, setArticleText] = useState("");
  const [linkPhrase, setLinkPhrase] = useState("");
  const [files, setFiles] = useState([]);
  const [targets, setTargets] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [outcomes, setOutcomes] = useState(null);
  const [pubId, setPubId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [retryCh, setRetryCh] = useState(null);
  const [scheduled, setScheduled] = useState([]);
  const [report, setReport] = useState([]);
  const [reportMore, setReportMore] = useState(false);  // есть ли ещё старые страницы
  const [showSchedule, setShowSchedule] = useState(false);
  const [alert, setAlert] = useState(null);
  const base = `/api/profiles/${profile.id}`;

  const loadTargets = useCallback(async () => {
    try {
      const t = await api.get(`${base}/publish/targets?content_type=post`);
      setTargets(t);
      setSelected((prev) => new Set([...prev].filter((c) => t.find((x) => x.channel === c && x.eligible))));
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
  }, [base]);

  const loadScheduled = useCallback(async () => {
    try { setScheduled(await api.get(`${base}/scheduled`)); } catch (_) {}
  }, [base]);

  // Журнал планировщика — итоги исполненных постов из БД (переживают перезагрузку).
  // Историю грузим ОДИН раз (первая страница) и дополняем инкрементально по курсору
  // published_at: since — новые сверху, before — старые по кнопке «показать ещё».
  const newestCursor = useRef(null);  // published_at самой свежей записи — для since
  const oldestCursor = useRef(null);  // published_at самой старой — для before
  useEffect(() => {
    newestCursor.current = report.length ? report[0].cursor : null;
    oldestCursor.current = report.length ? report[report.length - 1].cursor : null;
  }, [report]);

  const loadReportInitial = useCallback(async () => {
    try {
      const rows = await api.get(`${base}/scheduled/report?limit=${REPORT_PAGE}`);
      setReport(rows);
      setReportMore(rows.length === REPORT_PAGE);
    } catch (_) {}
  }, [base]);

  // Инкремент: тянем только исполненное ПОЗЖЕ маркера. Пусто → ничего не перерисовываем.
  const loadReportDelta = useCallback(async () => {
    const since = newestCursor.current;
    if (!since) { loadReportInitial(); return; }
    try {
      const rows = await api.get(`${base}/scheduled/report?since=${encodeURIComponent(since)}`);
      if (rows.length) setReport((prev) => mergeReports(prev, rows));
    } catch (_) {}
  }, [base, loadReportInitial]);

  const loadReportMore = useCallback(async () => {
    const before = oldestCursor.current;
    if (!before) return;
    try {
      const rows = await api.get(`${base}/scheduled/report?before=${encodeURIComponent(before)}&limit=${REPORT_PAGE}`);
      setReport((prev) => mergeReports(prev, rows));
      setReportMore(rows.length === REPORT_PAGE);
    } catch (_) {}
  }, [base]);

  useEffect(() => { loadTargets(); loadScheduled(); loadReportInitial(); }, [loadTargets, loadScheduled, loadReportInitial]);

  // Поллинг без перезагрузки: планировщик — фоновый процесс, отправляет посты сам.
  // Очередь меняется часто → поллим каждые 10 сек; журнал — только инкремент (since).
  // Page Visibility: на скрытой вкладке поллинг на паузе; при возврате — сразу тик.
  useEffect(() => {
    let timer = null;
    const tick = () => { loadScheduled(); loadReportDelta(); };
    const start = () => { if (!timer) timer = setInterval(tick, 10000); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
    const onVis = () => {
      if (document.visibilityState === "visible") { tick(); start(); } else stop();
    };
    document.addEventListener("visibilitychange", onVis);
    if (document.visibilityState === "visible") start();
    return () => { document.removeEventListener("visibilitychange", onVis); stop(); };
  }, [loadScheduled, loadReportDelta]);

  function toggle(ch) {
    setSelected((prev) => {
      const next = new Set(prev);
      next.has(ch) ? next.delete(ch) : next.add(ch);
      return next;
    });
  }

  function buildForm(extra) {
    const fd = new FormData();
    fd.append("content_type", "post");
    fd.append("text", text);
    fd.append("article_text", articleText);
    fd.append("link_phrase", linkPhrase);
    fd.append("channels", JSON.stringify([...selected]));
    files.forEach((f) => fd.append("media", f));
    Object.entries(extra || {}).forEach(([k, v]) => fd.append(k, v));
    return fd;
  }

  // Пост валиден, если есть текст ИЛИ фото (текстовый пост — норма).
  const hasContent = text.trim().length > 0 || files.length > 0;
  const canSend = selected.size > 0 && hasContent && !busy;

  async function publishNow() {
    setBusy(true); setAlert(null); setOutcomes(null);
    try {
      const res = await api.postForm(`${base}/publish`, buildForm());
      setPubId(res.publication_id);
      setOutcomes(res.outcomes);
      loadTargets();
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
    finally { setBusy(false); }
  }

  async function retry(ch) {
    setRetryCh(ch);
    try {
      const o = await api.post(`${base}/publish/${pubId}/retry/${ch}`);
      setOutcomes((prev) => prev.map((x) => (x.channel === ch ? o : x)));
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
    finally { setRetryCh(null); }
  }

  async function doSchedule(whenLocal) {
    setShowSchedule(false); setBusy(true); setAlert(null);
    try {
      // naive-local (без Z): исполнитель сравнивает по локальному времени.
      await api.postForm(`${base}/scheduled`, buildForm({ scheduled_at: whenLocal }));
      setAlert({ type: "success", text: "Пост запланирован." });
      setText(""); setArticleText(""); setLinkPhrase(""); setFiles([]); setOutcomes(null);
      loadScheduled();
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
    finally { setBusy(false); }
  }

  const eligibleCount = (targets || []).filter((t) => t.eligible).length;

  return h("div", null,
    h("h1", { className: "page-title" }, "Публикация"),
    h("p", { className: "page-subtitle" }, `ПРОФИЛЬ · ${profile.name}`),

    // Контент
    h("p", { className: "section-title" }, "Контент"),
    h("div", { className: "form-panel", style: { maxWidth: "100%" } },
      h("textarea", {
        className: "form-input", rows: 4, placeholder: "Текст поста…",
        value: text, onChange: (e) => setText(e.target.value),
        style: { resize: "vertical", fontFamily: "var(--font-ui)" },
      }),
      h("div", { className: "mt-2" }, h(PhotoPicker, { files, onChange: setFiles })),
      // Опциональный лонгрид: заполнено → статья уйдёт в Telegraph ПЕРВОЙ,
      // а в пост добавится ссылка на неё (Instant View). Пусто → обычный пост.
      h("div", { className: "mt-2" },
        h("label", { className: "form-label" }, "Текст статьи (Telegraph) — необязательно"),
        h("textarea", {
          className: "form-input", rows: 4,
          placeholder: "Заполните — выйдет статья в Telegraph, а в пост добавится ссылка на неё…",
          value: articleText, onChange: (e) => setArticleText(e.target.value),
          style: { resize: "vertical", fontFamily: "var(--font-ui)" },
        }),
        articleText.trim()
          ? h("p", { className: "hint-inline", style: { marginTop: "6px" } },
              "Статья опубликуется первой; пост получит ссылку на неё.")
          : null,
        articleText.trim() && h("div", { className: "mt-2" },
          h("label", { className: "form-label" }, "Текст ссылки"),
          h("input", {
            className: "form-input",
            type: "text",
            placeholder: "Подробнее",
            value: linkPhrase,
            onChange: (e) => setLinkPhrase(e.target.value),
            maxLength: 64,
          }),
          h("p", { className: "form-hint" },
            `В посте слово «${linkPhrase.trim() || "Подробнее"}» станет кликабельной ссылкой на статью.`),
        ),
      ),
    ),

    // Каналы
    h("p", { className: "section-title" }, "Куда публикуем"),
    targets === null
      ? h("div", { className: "flex-gap" }, h(Spinner), h("span", { className: "text-3" }, "Загружаю каналы…"))
      : eligibleCount === 0
        ? h("div", { className: "empty-inline" },
            "Нет доступных каналов. Подключите канал во вкладке «Каналы» — здесь появятся активные.")
        : h("div", { className: "target-grid" },
            targets.map((t) => h(TargetToggle, {
              key: t.channel, t, checked: selected.has(t.channel), onToggle: toggle,
            }))),

    // Действия
    h("div", { className: "publish-actions" },
      h("button", { className: "btn btn-primary", onClick: publishNow, disabled: !canSend },
        busy && h(Spinner), busy ? "Публикую…" : "Опубликовать сейчас"),
      h("button", { className: "btn btn-ghost", onClick: () => setShowSchedule(true), disabled: !canSend },
        "Запланировать"),
      selected.size === 0 && targets && eligibleCount > 0
        ? h("span", { className: "hint-inline" }, "выберите канал")
        : !hasContent
          ? h("span", { className: "hint-inline" }, "добавьте текст или фото")
          : null,
    ),
    alert && h(Alert, { type: alert.type }, alert.text),

    // Результаты
    outcomes && h("div", null,
      h("p", { className: "section-title", style: { marginTop: "24px" } }, "Результат по каналам"),
      h("div", { className: "outcome-grid" },
        outcomes.map((o) => h(OutcomeCard, { key: o.channel, o, onRetry: retry, retrying: retryCh === o.channel }))),
    ),

    // Запланированные (общий список: отмена + правка времени)
    h(ScheduledList, { base, items: scheduled, onChanged: loadScheduled }),

    // Журнал планировщика — что он уже отправил (обновляется сам, без перезагрузки)
    h(SchedulerReport, { base, items: report, hasMore: reportMore, onMore: loadReportMore }),

    showSchedule && h(ScheduleModal, { onClose: () => setShowSchedule(false), onConfirm: doSchedule }),
  );
}

// ── Журнал планировщика: исполненные посты с поканальными итогами ─────────────
// Данные из БД (scheduled_posts + publications) — переживают перезагрузку.
// Пагинация и since-инкремент — на сервере; здесь показ + фильтр + докачка.
// Скриншоты сбоя грузятся лениво при раскрытии карточки (отдельным запросом).

const REPORT_META = {
  done: { cls: "success", label: "Отправлено" },
  partial: { cls: "warning", label: "Частично" },
  failed: { cls: "error", label: "Не отправлено" },
  unknown: { cls: "info", label: "Без итогов" },
};
const REPORT_PAGE = 20;  // размер страницы (совпадает с limit на сервере)
const isReportProblem = (r) => r.overall === "partial" || r.overall === "failed";

// Слить страницы журнала: дедуп по id, сортировка по курсору (published_at) — свежие
// сверху. cursor — ISO в UTC, поэтому строковое сравнение = хронологическое.
function mergeReports(prev, rows) {
  if (!rows || !rows.length) return prev;
  const byId = new Map(prev.map((r) => [r.id, r]));
  rows.forEach((r) => byId.set(r.id, r));
  return [...byId.values()].sort((a, b) =>
    a.cursor < b.cursor ? 1 : a.cursor > b.cursor ? -1 : b.id - a.id);
}

// Метка дня для группировки: «Сегодня» / «Вчера» / дд.мм.гггг
function reportDayLabel(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return "Сегодня";
  if (same(d, yest)) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function SchedulerReport({ base, items, hasMore, onMore }) {
  const [filter, setFilter] = useState("all");  // all | problems
  if (!items || items.length === 0) return null;

  const problemCount = items.filter(isReportProblem).length;
  const shown = filter === "problems" ? items.filter(isReportProblem) : items;

  // Группировка по дням с сохранением порядка (свежие сверху; курсор — published_at).
  const groups = [];
  for (const r of shown) {
    const label = reportDayLabel(r.cursor);
    let g = groups[groups.length - 1];
    if (!g || g.label !== label) { g = { label, rows: [] }; groups.push(g); }
    g.rows.push(r);
  }

  return h("div", null,
    h("p", { className: "section-title", style: { marginTop: "24px" } }, "Журнал планировщика"),
    h("div", { className: "report-toolbar" },
      h("div", { className: "report-filter" },
        h("button", { className: filter === "all" ? "active" : "", onClick: () => setFilter("all") }, "Все"),
        h("button", { className: filter === "problems" ? "active" : "", onClick: () => setFilter("problems") },
          `Проблемные${problemCount ? ` · ${problemCount}` : ""}`),
      ),
      h("span", { className: "report-count" }, `загружено ${items.length}`),
    ),
    filter === "problems" && shown.length === 0
      ? h("p", { className: "text-3", style: { fontSize: "13px" } }, "Проблемных постов среди загруженных нет.")
      : groups.map((g, i) => h("div", { key: i },
          h("div", { className: "report-day" }, g.label),
          h("div", { className: "report-rows" },
            g.rows.map((r) => h(ReportRow, { key: r.id, base, r })),
          ),
        )),
    hasMore && h("button", { className: "btn-ghost report-more", onClick: onMore }, "Показать ещё"),
  );
}

// Компактная строка: время · превью · статус-точки каналов · раскрытие деталей по клику.
// Успешные свёрнуты и приглушены; проблемные (partial/failed) раскрыты и заметны.
// Скриншоты сбоя тянем лениво (только для проблемных) при первом раскрытии.
function ReportRow({ base, r }) {
  const problem = isReportProblem(r);
  const [open, setOpen] = useState(problem);
  const [shots, setShots] = useState(null);  // null=не грузили, {} или {channel: path}
  useEffect(() => {
    if (open && problem && shots === null) {
      api.get(`${base}/scheduled/${r.id}/screenshots`).then(setShots).catch(() => setShots({}));
    }
  }, [open, problem, shots, base, r.id]);

  const meta = REPORT_META[r.overall] || REPORT_META.unknown;
  const when = new Date(r.cursor).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const preview = (r.text || "").trim() || "(без текста)";
  return h("div", { className: `report-row ${meta.cls}${problem ? "" : " muted"}` },
    h("button", { className: "report-row-head", onClick: () => setOpen(!open) },
      h("span", { className: "report-time mono" }, when),
      h("span", { className: `outcome-badge ${meta.cls}` }, meta.label),
      h("span", { className: "report-preview" }, preview),
      h("span", { className: "report-chips" },
        r.outcomes.map((o) => {
          const cm = OUTCOME_META[o.status] || { cls: "info" };
          return h("span", { key: o.channel, className: `report-chip ${cm.cls}`, title: o.channel });
        }),
      ),
      h("span", { className: "report-caret" }, open ? "▾" : "▸"),
    ),
    open && h("div", { className: "report-detail" },
      r.outcomes.map((o) => {
        const cm = OUTCOME_META[o.status] || { cls: "info", label: o.status };
        const shot = shots && shots[o.channel];
        return h("div", { className: "report-chan-row", key: o.channel },
          h("span", { className: `outcome-badge ${cm.cls}` }, cm.label),
          h("span", { className: "outcome-ch mono" }, o.channel),
          o.error && h("span", { className: "outcome-err" }, o.error),
          shot && h("span", { className: "text-3 mono" }, "📷 скриншот сбоя"),
        );
      }),
    ),
  );
}

// ── Запланированные: список с отменой и правкой времени ──────────────────────

function SchedItem({ base, s, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [when, setWhen] = useState(() => toLocalInput(s.scheduled_at));
  const [busy, setBusy] = useState(false);
  const [sending, setSending] = useState(false);
  const [sendResult, setSendResult] = useState(null); // {all_done, results}
  const [err, setErr] = useState(null);

  async function save() {
    setBusy(true); setErr(null);
    try {
      // Шлём naive-local (без Z): исполнитель сравнивает по локальному времени.
      await api.patch(`${base}/scheduled/${s.id}`, { scheduled_at: when });
      setEditing(false); onChanged?.();
    } catch (ex) { setErr(ex.message); } finally { setBusy(false); }
  }
  async function cancel() {
    try { await api.del(`${base}/scheduled/${s.id}`); onChanged?.(); }
    catch (ex) { setErr(ex.message); }
  }
  async function sendNow() {
    setSending(true); setErr(null); setSendResult(null);
    try {
      const res = await api.post(`${base}/scheduled/${s.id}/publish-now`, {});
      setSendResult(res);
      if (res.all_done) onChanged?.(); // пост опубликован — убрать из списка
    } catch (ex) { setErr(ex.message); } finally { setSending(false); }
  }

  return h("div", { className: "sched-item" },
    h("div", { className: "sched-main" },
      editing
        ? h("div", { className: "sched-edit" },
            h("input", { className: "form-input", type: "datetime-local", value: when,
              onChange: (e) => setWhen(e.target.value), style: { maxWidth: "220px" } }),
            h("button", { className: "btn btn-primary btn-sm", onClick: save, disabled: busy },
              busy && h(Spinner), busy ? " Сохраняю…" : "Сохранить"),
            h("button", { className: "btn btn-ghost btn-sm", onClick: () => setEditing(false) }, "Отмена"),
          )
        : h("div", { className: "sched-when mono" }, new Date(s.scheduled_at).toLocaleString("ru-RU")),
      h("div", { className: "sched-text" },
        s.text || "(без текста)",
        s.has_article && h("span", { className: "sched-badge",
          title: "К посту привязана статья Telegraph — выйдет первой, пост получит ссылку" },
          " + статья"),
      ),
      h("div", { className: "sched-chans mono" }, s.channels.join(" · ")),
      err && h("div", { className: "outcome-err" }, err),
      sendResult && h("div", { className: "sched-result" },
        (sendResult.results || []).map((r, i) => h("div", {
          key: i,
          className: `sched-result-row ${r.status === "done" || r.status === "submitted" ? "ok" : "fail"}`,
        },
          h("span", { className: "mono" }, r.channel),
          h("span", null, " → "),
          h("span", null, r.status === "done" || r.status === "submitted" ? "✓ опубликовано" : `✗ ${r.error || r.status}`),
        )),
      ),
    ),
    !editing && h("div", { className: "sched-actions" },
      h("button", { className: "btn btn-primary btn-sm", onClick: sendNow, disabled: sending },
        sending && h(Spinner), sending ? " Отправляю…" : "Отправить сейчас"),
      h("button", { className: "btn btn-ghost btn-sm",
        onClick: () => { setWhen(toLocalInput(s.scheduled_at)); setEditing(true); } }, "Время"),
      h("button", { className: "btn btn-danger btn-sm", onClick: cancel }, "Отменить"),
    ),
  );
}

function ScheduledList({ base, items, onChanged }) {
  if (!items.length) return null;
  return h("div", null,
    h("p", { className: "section-title", style: { marginTop: "24px" } }, `Запланировано (${items.length})`),
    h("div", { className: "sched-list" },
      items.map((s) => h(SchedItem, { key: s.id, base, s, onChanged }))),
  );
}

// ── Импорт контент-плана ─────────────────────────────────────────────────────

function TableDrop({ file, onPick }) {
  const ref = useRef(null);
  return h("div", null,
    h("div", { className: `import-drop ${file ? "filled" : ""}`, onClick: () => ref.current?.click() },
      h("span", { className: "import-drop-ic" }, file ? "✓" : "CSV"),
      h("div", { className: "import-drop-body" },
        h("span", { className: "import-drop-title" }, file ? file.name : "Выберите таблицу плана"),
        h("span", { className: "import-drop-sub" },
          file ? `${(file.size / 1024).toFixed(1)} КБ` : "CSV или XLSX · колонки: файл, текст, дата, время"),
      ),
    ),
    h("input", { ref, type: "file", accept: ".csv,.xlsx,.xlsm", style: { display: "none" },
      onChange: (e) => { const f = e.target.files?.[0]; if (f) onPick(f); e.target.value = ""; } }),
  );
}

function RuleFields({ startDate, times, onStart, onTimes }) {
  return h("div", { className: "rule-grid" },
    h("div", { className: "form-group", style: { margin: 0 } },
      h("label", { className: "form-label" }, "Первый день"),
      h("input", { className: "form-input", type: "date", value: startDate,
        onChange: (e) => onStart(e.target.value) }),
    ),
    h("div", { className: "form-group", style: { margin: 0 } },
      h("label", { className: "form-label" }, "Времена постинга"),
      h("input", { className: "form-input mono", placeholder: "10:00, 18:00", value: times,
        onChange: (e) => onTimes(e.target.value) }),
      h("p", { className: "form-hint" },
        "Через запятую. Строки без явной даты раскидаются по слотам, в порядке имён файлов."),
    ),
  );
}

function ImportReportView({ report }) {
  const warnings = report.warnings || [];
  return h("div", null,
    h("div", { className: "report-chips" },
      h("span", { className: "chip ok" }, `Запланировано: ${report.resolved_count}`),
      warnings.length > 0 && h("span", { className: "chip warn" }, `Без фото: ${warnings.length}`),
      report.problem_count > 0 && h("span", { className: "chip err" }, `Пропущено: ${report.problem_count}`),
      report.unmatched_files.length > 0
        && h("span", { className: "chip warn" }, `Файлов без строк: ${report.unmatched_files.length}`),
    ),
    report.resolved.length > 0 && h("div", null,
      h("p", { className: "section-title" }, "Расписание"),
      h("div", { className: "plan-rows" },
        report.resolved.map((r, i) => h("div", { key: i, className: "plan-row" },
          h("span", { className: "plan-when mono" }, new Date(r.scheduled_at).toLocaleString("ru-RU")),
          h("span", { className: "plan-file mono" }, r.file || "текст"),
          h("span", { className: "plan-text" },
            r.text || "(без текста)",
            r.has_article && h("span", { className: "sched-badge",
              title: "Строка несёт статью Telegraph — выйдет первой, пост получит ссылку" }, " + статья"),
          ),
          h("span", { className: `plan-src ${r.source}` }, r.source === "rule" ? "правило" : "дата"),
        ))),
    ),
    warnings.length > 0 && h("div", null,
      h("p", { className: "section-title", style: { marginTop: "18px" } }, "Предупреждения — посты выйдут без фото"),
      h("div", { className: "plan-rows" },
        warnings.map((w, i) => h("div", { key: i, className: "plan-row warn" },
          h("span", { className: "plan-file mono" }, `стр. ${w.row_number}`),
          h("span", { className: "plan-file mono" }, w.file || "—"),
          h("span", { className: "plan-reason" }, w.reason),
        ))),
    ),
    report.problems.length > 0 && h("div", null,
      h("p", { className: "section-title", style: { marginTop: "18px" } }, "Пропущенные строки"),
      h("div", { className: "plan-rows" },
        report.problems.map((p, i) => h("div", { key: i, className: "plan-row bad" },
          h("span", { className: "plan-file mono" }, `стр. ${p.row_number}`),
          h("span", { className: "plan-file mono" }, p.file || "—"),
          h("span", { className: "plan-reason" }, p.reason),
        ))),
    ),
    report.unmatched_files.length > 0 && h("p", { className: "plan-unmatched" },
      `Картинки без строки в таблице: ${report.unmatched_files.join(", ")}`),
  );
}

function ImportView({ profile }) {
  const base = `/api/profiles/${profile.id}`;
  const [table, setTable] = useState(null);
  const [images, setImages] = useState([]);
  const [startDate, setStartDate] = useState(() => todayStr());
  const [times, setTimes] = useState("10:00, 18:00");
  const [targets, setTargets] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [report, setReport] = useState(null);
  const [scheduled, setScheduled] = useState([]);
  const [busy, setBusy] = useState(false);
  const [committing, setCommitting] = useState(false);
  const [alert, setAlert] = useState(null);

  const loadTargets = useCallback(async () => {
    try { setTargets(await api.get(`${base}/publish/targets?content_type=post`)); }
    catch (ex) { setAlert({ type: "error", text: ex.message }); }
  }, [base]);
  const loadScheduled = useCallback(async () => {
    try { setScheduled(await api.get(`${base}/scheduled`)); } catch (_) {}
  }, [base]);
  useEffect(() => { loadTargets(); loadScheduled(); }, [loadTargets, loadScheduled]);

  function toggle(ch) {
    setSelected((prev) => { const n = new Set(prev); n.has(ch) ? n.delete(ch) : n.add(ch); return n; });
  }
  function appendRule(fd) {
    if (startDate) fd.append("start_date", startDate);
    if (times.trim()) fd.append("times_csv", times);
  }

  async function preview() {
    if (!table) { setAlert({ type: "error", text: "Выберите таблицу плана." }); return; }
    setBusy(true); setAlert(null); setReport(null);
    try {
      const fd = new FormData();
      fd.append("table", table);
      fd.append("filenames", JSON.stringify(images.map((f) => f.name)));
      appendRule(fd);
      setReport(await api.postForm(`${base}/import/preview`, fd));
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
    finally { setBusy(false); }
  }

  async function commit() {
    setCommitting(true); setAlert(null);
    try {
      const fd = new FormData();
      fd.append("table", table);
      fd.append("channels", JSON.stringify([...selected]));
      fd.append("content_type", "post");
      images.forEach((f) => fd.append("media", f));
      appendRule(fd);
      const res = await api.postForm(`${base}/import/commit`, fd);
      const parts = [`создано ${res.created}`];
      if ((res.warnings || []).length > 0) parts.push(`без фото: ${res.warnings.length}`);
      if (res.skipped_count > 0) parts.push(`пропущено ${res.skipped_count}`);
      setAlert({ type: res.created > 0 ? "success" : "error", text: `Запланировано: ${parts.join(", ")}.` });
      setReport(null); setTable(null); setImages([]);
      loadScheduled();
    } catch (ex) { setAlert({ type: "error", text: ex.message }); }
    finally { setCommitting(false); }
  }

  const eligibleCount = (targets || []).filter((t) => t.eligible).length;
  const canPreview = !!table && !busy;
  const canCommit = !!table && selected.size > 0 && report && report.resolved_count > 0 && !committing;

  return h("div", null,
    h("h1", { className: "page-title" }, "Импорт контент-плана"),
    h("p", { className: "page-subtitle" }, `ПРОФИЛЬ · ${profile.name}`),

    h("p", { className: "section-title" }, "Таблица плана"),
    h(TableDrop, { file: table, onPick: setTable }),

    h("p", { className: "section-title", style: { marginTop: "20px" } }, "Картинки"),
    h("div", { className: "form-panel", style: { maxWidth: "100%" } },
      h(PhotoPicker, { files: images, onChange: setImages }),
      h("p", { className: "form-hint mt-2" },
        "Свяжутся со строками таблицы по имени файла (2.jpg < 10.jpg — натуральный порядок)."),
    ),

    h("p", { className: "section-title", style: { marginTop: "20px" } }, "Правило раскидки"),
    h("div", { className: "form-panel", style: { maxWidth: "100%" } },
      h(RuleFields, { startDate, times, onStart: setStartDate, onTimes: setTimes })),

    h("p", { className: "section-title", style: { marginTop: "20px" } }, "Куда публикуем"),
    targets === null
      ? h("div", { className: "flex-gap" }, h(Spinner), h("span", { className: "text-3" }, "Загружаю каналы…"))
      : targets.length === 0
        ? h("div", { className: "empty-inline" },
            "Нет доступных каналов. Подключите канал во вкладке «Каналы».")
        : h("div", null,
            eligibleCount === 0 && h("div", { className: "empty-inline", style: { marginBottom: "10px" } },
              "Каналы подключены, но у каждого не задана цель публикации. ",
              "Откройте вкладку «Каналы» и заполните адрес группы / ID канала."),
            h("div", { className: "target-grid" },
              targets.map((t) => h(TargetToggle, {
                key: t.channel, t, checked: selected.has(t.channel), onToggle: toggle,
              })))),

    h("div", { className: "publish-actions" },
      h("button", { className: "btn btn-ghost", onClick: preview, disabled: !canPreview },
        busy && h(Spinner), busy ? " Считаю…" : "Показать превью"),
      h("button", { className: "btn btn-primary", onClick: commit, disabled: !canCommit },
        committing && h(Spinner), committing ? " Планирую…" : "Запланировать всё"),
      !table ? h("span", { className: "hint-inline" }, "выберите таблицу")
        : !report ? h("span", { className: "hint-inline" }, "сначала превью")
          : selected.size === 0 ? h("span", { className: "hint-inline" }, "выберите канал") : null,
    ),
    alert && h(Alert, { type: alert.type }, alert.text),

    report && h("div", { style: { marginTop: "16px" } }, h(ImportReportView, { report })),

    h(ScheduledList, { base, items: scheduled, onChanged: loadScheduled }),
  );
}

function ViewTabs({ view, onChange }) {
  const tabs = [["publish", "Публикация"], ["import", "Импорт плана"], ["channels", "Каналы"]];
  return h("div", { className: "view-tabs", role: "tablist" },
    tabs.map(([id, label]) => h("button", {
      key: id,
      className: `view-tab ${view === id ? "active" : ""}`,
      role: "tab",
      "aria-selected": view === id,
      onClick: () => onChange(id),
    }, label)),
  );
}

// ── Авторизация: вход, шапка пользователя, создание клиентского аккаунта ─────

function LoginView({ onSuccess }) {
  const [login, setLogin] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);

  async function submit(e) {
    e.preventDefault();
    if (!login.trim() || !password) return;
    setLoading(true); setErr(null);
    try {
      const me = await api.post("/api/auth/login", { login: login.trim(), password });
      onSuccess(me);
    } catch (ex) { setErr(ex.message); }
    finally { setLoading(false); }
  }

  return h("div", { className: "login-wrap" },
    h("form", { className: "login-card", onSubmit: submit },
      h("div", { className: "login-logo" }, "⊹ CROSSPOST"),
      h("p", { className: "login-sub" }, "Вход в панель"),
      h("div", { className: "form-group" },
        h("label", { className: "form-label", htmlFor: "l-login" }, "Логин"),
        h("input", { id: "l-login", ref, className: "form-input", value: login,
          autoComplete: "username", onChange: (e) => setLogin(e.target.value) }),
      ),
      h("div", { className: "form-group" },
        h("label", { className: "form-label", htmlFor: "l-pass" }, "Пароль"),
        h("input", { id: "l-pass", className: "form-input", type: "password", value: password,
          autoComplete: "current-password", onChange: (e) => setPassword(e.target.value) }),
      ),
      err && h(Alert, { type: "error" }, err),
      h("button", { type: "submit", className: "btn btn-primary", style: { width: "100%", marginTop: "8px" },
        disabled: loading || !login.trim() || !password },
        loading && h(Spinner), loading ? " Вхожу…" : "Войти"),
    ),
  );
}

// Тумблер видимости окна браузера при публикации (только админ).
// Логин всегда виден — тумблер на него не влияет (бэкенд: config.browser_headless).
function BrowserVisibilityToggle() {
  const [headless, setHeadless] = useState(null); // null=грузим/недоступно
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    api.get("/api/settings/browser")
      .then(s => setHeadless(s.headless))
      .catch(() => setHeadless(null));
  }, []);

  async function toggle() {
    if (headless === null || busy) return;
    setBusy(true);
    try {
      const s = await api.put("/api/settings/browser", { headless: !headless });
      setHeadless(s.headless);
    } catch (_) {} finally { setBusy(false); }
  }

  if (headless === null) return null;
  const visible = !headless;
  return h("button", {
    className: "btn btn-ghost btn-sm",
    onClick: toggle,
    disabled: busy,
    title: "Видимость окна браузера при публикации. Вход в аккаунт всегда виден.",
  },
    h("span", { className: `lamp ${visible ? "live" : "grey"}` }),
    visible ? " Браузер виден" : " Браузер скрыт",
  );
}

function TopBar({ me, onLogout, profiles, activeProfileId, onSelectProfile, isAdmin }) {
  return h("div", { className: "topbar" },
    me.role === "client" && h("div", { className: "client-brand" }, "⊹ CROSSPOST"),
    isAdmin && profiles.length > 0 && h("select", {
      className: "topbar-profile-select",
      value: activeProfileId ?? "",
      title: "Переключить профиль",
      onChange: e => {
        const p = profiles.find(x => x.id === Number(e.target.value));
        if (p) onSelectProfile(p);
      },
    },
      profiles.map(p => h("option", { key: p.id, value: p.id }, p.name)),
    ),
    me.role === "admin" && h(BrowserVisibilityToggle),
    h("div", { className: "user-chip" },
      h("span", { className: `role-badge ${me.role}` }, me.role === "admin" ? "Админ" : "Клиент"),
      h("span", { className: "user-name" }, me.login),
    ),
    h("button", { className: "btn btn-ghost btn-sm", onClick: onLogout }, "Выйти"),
  );
}

function NewClientModal({ profiles, onClose, onCreated }) {
  const [login, setLogin] = useState("");
  const [password, setPassword] = useState("");
  const [profileId, setProfileId] = useState(profiles[0]?.id ?? "");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [done, setDone] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setLoading(true); setErr(null);
    try {
      const u = await api.post("/api/users", {
        login: login.trim(), password, profile_id: Number(profileId),
      });
      onCreated?.(u);
      // Показываем сводку: логин/пароль передать клиенту вне системы (в ТГ).
      setDone({ login: u.login, password });
    } catch (ex) { setErr(ex.message); }
    finally { setLoading(false); }
  }

  if (done) {
    return h(Modal, { title: "Аккаунт создан", onClose },
      h("p", { className: "form-hint", style: { marginBottom: "12px" } },
        "Передайте эти данные клиенту в ТГ. Пароль больше не будет показан."),
      h("div", { className: "form-group" },
        h("label", { className: "form-label" }, "Логин"),
        h("input", { className: "form-input mono", value: done.login, readOnly: true }),
      ),
      h("div", { className: "form-group" },
        h("label", { className: "form-label" }, "Пароль"),
        h("input", { className: "form-input mono", value: done.password, readOnly: true }),
      ),
      h("button", { className: "btn btn-primary", onClick: onClose }, "Готово"),
    );
  }

  return h(Modal, { title: "Новый клиентский аккаунт", onClose },
    h("form", { onSubmit: submit },
      h("div", { className: "form-group" },
        h("label", { className: "form-label" }, "Профиль клиента"),
        h("select", { className: "form-input", value: profileId,
          onChange: (e) => setProfileId(e.target.value) },
          profiles.map(p => h("option", { key: p.id, value: p.id }, p.name))),
      ),
      h("div", { className: "form-group" },
        h("label", { className: "form-label" }, "Логин"),
        h("input", { className: "form-input", value: login, autoComplete: "off",
          onChange: (e) => setLogin(e.target.value) }),
      ),
      h("div", { className: "form-group" },
        h("label", { className: "form-label" }, "Пароль"),
        h("input", { className: "form-input mono", value: password, autoComplete: "off",
          onChange: (e) => setPassword(e.target.value) }),
        h("p", { className: "form-hint" }, "Задайте пароль (мин. 6 символов) и передайте клиенту в ТГ."),
      ),
      err && h(Alert, { type: "error" }, err),
      h("div", { className: "flex-gap mt-2" },
        h("button", { type: "submit", className: "btn btn-primary",
          disabled: loading || login.trim().length < 3 || password.length < 6 || !profileId },
          loading && h(Spinner), loading ? " Создаю…" : "Создать аккаунт"),
        h("button", { type: "button", className: "btn btn-ghost", onClick: onClose }, "Отмена"),
      ),
    ),
  );
}

function NoAccessView() {
  return h("div", { className: "empty-state" },
    h("span", { className: "empty-icon" }, "⌀"),
    h("h2", { className: "empty-title" }, "Профиль недоступен"),
    h("p", { className: "empty-body" },
      "К вашему аккаунту не привязан профиль. Обратитесь к администратору."),
  );
}

function App() {
  const [me, setMe] = useState(undefined); // undefined=проверяем, null=не вошёл, obj=вошёл
  const [profiles, setProfiles] = useState([]);
  const [active, setActive] = useState(null);
  const [view, setView] = useState("publish");
  const [consoleOpen, setConsoleOpen] = useState(false);  // admin: консоль ошибок поверх профилей
  const [focusChannel, setFocusChannel] = useState(null); // подсветить канал после перехода из консоли
  const [showNewProfile, setShowNewProfile] = useState(false);
  const [showNewClient, setShowNewClient] = useState(false);
  const [loadingProfiles, setLoadingProfiles] = useState(false);

  // Проверка сессии при загрузке: 401 → показать вход.
  useEffect(() => {
    api.get("/api/auth/me").then(setMe).catch(() => setMe(null));
  }, []);

  const loadProfiles = useCallback(() => {
    setLoadingProfiles(true);
    api.get("/api/profiles")
      .then(data => {
        setProfiles(data);
        setActive(prev => {
          if (prev && data.find(p => p.id === prev.id)) return prev;
          const savedId = Number(localStorage.getItem("crosspost_active_profile"));
          return data.find(p => p.id === savedId) || data[0] || null;
        });
      })
      .catch(() => {})
      .finally(() => setLoadingProfiles(false));
  }, []);

  useEffect(() => { if (me) loadProfiles(); }, [me, loadProfiles]);

  async function logout() {
    try { await api.post("/api/auth/logout"); } catch (_) {}
    setMe(null); setProfiles([]); setActive(null);
  }

  if (me === undefined) return h("div", { className: "login-wrap" }, h(Spinner));
  if (me === null) return h(LoginView, { onSuccess: setMe });

  const isAdmin = me.role === "admin";

  function onProfileCreated(p) {
    setProfiles(prev => [...prev, p]);
    setActive(p);
  }

  function selectProfile(p) {
    setConsoleOpen(false);
    setFocusChannel(null);
    setActive(p);
    localStorage.setItem("crosspost_active_profile", String(p.id));
  }

  // Переход из строки консоли: открыть профиль клиента на вкладке «Каналы», подсветить канал.
  function goToProfile(pid, channel) {
    const p = profiles.find(x => x.id === pid);
    if (!p) return;
    setConsoleOpen(false);
    setActive(p);
    setView("channels");
    setFocusChannel(channel || null);
  }

  const mainBody = loadingProfiles
    ? h("div", { className: "flex-gap" }, h(Spinner), h("span", { className: "text-3" }, "Загружаю…"))
    : (isAdmin && consoleOpen)
      ? h(ErrorConsole, { key: "console", profiles, onGoToProfile: goToProfile })
      : active
      ? h("div", null,
          h(ViewTabs, { view, onChange: setView }),
          view === "publish"
            ? h(PublishView, { key: `pub-${active.id}`, profile: active })
            : view === "import"
              ? h(ImportView, { key: `imp-${active.id}`, profile: active })
              : h(ChannelsView, { key: active.id, profile: active, focusChannel }),
        )
      : (isAdmin ? h(NoProfileView) : h(NoAccessView));

  return h("div", { id: "root-inner", style: { display: "contents" } },
    // Список клиентов слева — ТОЛЬКО у админа. Клиент идёт сразу в свой профиль.
    isAdmin && h(Sidebar, {
      profiles,
      activeId: consoleOpen ? null : active?.id,
      onSelect: selectProfile,
      onNew: () => setShowNewProfile(true),
      onNewClient: () => setShowNewClient(true),
      onOpenConsole: () => setConsoleOpen(true),
      consoleActive: consoleOpen,
    }),
    h("main", { className: "main" },
      h(TopBar, {
        me, onLogout: logout,
        profiles, activeProfileId: active?.id, onSelectProfile: selectProfile, isAdmin,
      }),
      mainBody,
    ),
    showNewProfile && h(NewProfileModal, {
      onClose: () => setShowNewProfile(false),
      onCreated: onProfileCreated,
    }),
    showNewClient && h(NewClientModal, {
      profiles,
      onClose: () => setShowNewClient(false),
    }),
  );
}

// ── Mount ──────────────────────────────────────────────────────────────────
createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
