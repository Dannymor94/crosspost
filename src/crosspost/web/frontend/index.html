<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosspost · Пульт оператора</title>
<style>
/* ── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

/* ── Design tokens ───────────────────────────────────────────────────────── */
:root {
  --bg:         #111418;
  --bg-panel:   #181d24;
  --bg-card:    #1e2530;
  --bg-card-h:  #242c3a;
  --bg-input:   #151a21;
  --border:     #2a3347;
  --border-f:   #3d5275;

  --text-1:     #e2e8f0;
  --text-2:     #8a9bb5;
  --text-3:     #4f617d;

  --accent:     #3b82f6;
  --accent-h:   #2563eb;
  --accent-dim: rgba(59,130,246,.15);

  /* Status lamps */
  --live:       #22c55e;
  --live-bg:    rgba(34,197,94,.12);
  --amber:      #f59e0b;
  --amber-bg:   rgba(245,158,11,.12);
  --grey:       #4f617d;
  --grey-bg:    rgba(79,97,125,.12);
  --error:      #f87171;
  --error-bg:   rgba(248,113,113,.10);

  --font-ui:    "Inter", "Helvetica Neue", system-ui, sans-serif;
  --font-mono:  "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace;

  --radius:     6px;
  --radius-lg:  10px;
  --shadow:     0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);

  --lamp-size:  10px;
}

/* ── Base ────────────────────────────────────────────────────────────────── */
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100dvh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Layout ──────────────────────────────────────────────────────────────── */
#root { display: flex; min-height: 100dvh; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.main {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  max-width: 900px;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-3);
}
.logo span {
  color: var(--accent);
}
.sidebar-section-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 20px 20px 8px;
}

.profile-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  color: var(--text-2);
  font-size: 14px;
  transition: background .1s, color .1s;
  border-left: 2px solid transparent;
}
.profile-item:hover { background: var(--bg-card); color: var(--text-1); }
.profile-item.active {
  background: var(--accent-dim);
  color: var(--text-1);
  border-left-color: var(--accent);
}
.profile-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.profile-item.active .profile-avatar {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}
.btn-new-profile {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  background: var(--bg-card);
  border: 1px dashed var(--border-f);
  border-radius: var(--radius);
  color: var(--text-2);
  font-size: 13px;
  cursor: pointer;
  transition: background .1s, color .1s, border-color .1s;
}
.btn-new-profile:hover {
  background: var(--bg-card-h);
  color: var(--text-1);
  border-color: var(--accent);
}

/* ── Typography ──────────────────────────────────────────────────────────── */
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -.01em;
  margin-bottom: 4px;
}
.page-subtitle {
  font-size: 13px;
  color: var(--text-3);
  font-family: var(--font-mono);
  margin-bottom: 28px;
}
.section-title {
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 12px;
}

/* ── Status lamp ─────────────────────────────────────────────────────────── */
.lamp {
  display: inline-block;
  width: var(--lamp-size);
  height: var(--lamp-size);
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}
.lamp::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  pointer-events: none;
}
.lamp.live {
  background: var(--live);
  box-shadow: 0 0 6px var(--live);
}
.lamp.live::after { box-shadow: 0 0 0 2px rgba(34,197,94,.2); }

.lamp.amber {
  background: var(--amber);
  box-shadow: 0 0 6px rgba(245,158,11,.6);
}
.lamp.grey { background: var(--grey); box-shadow: none; }

@media (prefers-reduced-motion: no-preference) {
  .lamp.live {
    animation: pulse-live 2.8s ease-in-out infinite;
  }
  .lamp.amber {
    animation: pulse-amber 2s ease-in-out infinite;
  }
}
@keyframes pulse-live {
  0%,100% { box-shadow: 0 0 4px var(--live); }
  50%      { box-shadow: 0 0 10px var(--live), 0 0 20px rgba(34,197,94,.3); }
}
@keyframes pulse-amber {
  0%,100% { box-shadow: 0 0 4px rgba(245,158,11,.7); }
  50%      { box-shadow: 0 0 10px var(--amber), 0 0 18px rgba(245,158,11,.4); }
}

/* ── Channel cards ───────────────────────────────────────────────────────── */
.channel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.channel-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow);
  transition: border-color .15s, background .15s;
}
.channel-card:hover { border-color: var(--border-f); background: var(--bg-card-h); }
.channel-card.live-card  { border-color: rgba(34,197,94,.25); }
.channel-card.amber-card { border-color: rgba(245,158,11,.2); }

.card-header {
  display: flex; align-items: flex-start; gap: 10px;
}
.card-icon {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  color: var(--text-3); letter-spacing: .02em;
  flex-shrink: 0; user-select: none;
}
.card-names { flex: 1; min-width: 0; }
.card-title {
  font-size: 14px; font-weight: 600; color: var(--text-1);
  line-height: 1.25; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-id {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--text-3);
}
.card-tier {
  font-size: 9px;
  font-family: var(--font-mono); font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-3);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  flex-shrink: 0; align-self: flex-start; margin-top: 1px;
}

.status-row {
  display: flex; align-items: center; gap: 8px;
}
.status-label {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-3);
}
.status-label.live   { color: var(--live); }
.status-label.amber  { color: var(--amber); }

.card-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 4px;
}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s, opacity .12s;
  border: 1px solid transparent;
  line-height: 1;
  white-space: nowrap;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-primary:not(:disabled):hover { background: var(--accent-h); border-color: var(--accent-h); }

.btn-ghost {
  background: transparent; color: var(--text-2); border-color: var(--border);
}
.btn-ghost:not(:disabled):hover {
  background: var(--bg-card); color: var(--text-1); border-color: var(--border-f);
}

.btn-danger {
  background: transparent; color: var(--error); border-color: rgba(248,113,113,.3);
}
.btn-danger:not(:disabled):hover {
  background: var(--error-bg); border-color: var(--error);
}

.btn-sm { padding: 5px 11px; font-size: 12px; }

/* ── Forms ───────────────────────────────────────────────────────────────── */
.form-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 520px;
  margin-bottom: 20px;
}
.form-title {
  font-size: 15px; font-weight: 600; color: var(--text-1);
  margin-bottom: 18px;
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px; font-family: var(--font-mono); font-weight: 600;
  color: var(--text-2);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-1);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 9px 12px;
  transition: border-color .12s;
  -webkit-appearance: none;
}
.form-input:focus { outline: none; border-color: var(--accent); }
.form-input::placeholder { color: var(--text-3); }
.form-hint {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.5;
}
.form-hint a, .form-link {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted rgba(59,130,246,.5);
}
.form-hint a:hover, .form-link:hover { border-bottom-style: solid; }

/* ── Step tracker (multi-step login) ─────────────────────────────────────── */
.step-track {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
}
.step-dot {
  display: flex; align-items: center; gap: 6px;
  color: var(--text-3);
}
.step-dot .dot {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: 10px;
}
.step-dot.active { color: var(--accent); }
.step-dot.active .dot { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.step-dot.done { color: var(--live); }
.step-dot.done .dot { border-color: var(--live); background: var(--live-bg); color: var(--live); }
.step-sep { flex: 1; height: 1px; background: var(--border); min-width: 8px; }

/* ── Alert / message ─────────────────────────────────────────────────────── */
@keyframes alert-in  { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
@keyframes alert-out { from { opacity:1; transform:translateY(0); }    to { opacity:0; transform:translateY(-5px); } }

.alert {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px; line-height: 1.5;
  margin-top: 14px;
  animation: alert-in .18s ease-out both;
}
.alert.dismissing { animation: alert-out .15s ease-in both; }
@media (prefers-reduced-motion: reduce) { .alert, .alert.dismissing { animation: none; } }

.alert.success { background: var(--live-bg);   color: var(--live);   border: 1px solid rgba(34,197,94,.25); }
.alert.error   { background: var(--error-bg);  color: var(--error);  border: 1px solid rgba(248,113,113,.4); font-weight: 500; }
.alert.warning { background: var(--amber-bg);  color: var(--amber);  border: 1px solid rgba(245,158,11,.25); }
.alert.info    { background: var(--accent-dim); color: var(--text-2); border: 1px solid rgba(59,130,246,.2); }

.alert-icon { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; display: flex; align-items: center; }
.alert-body { flex: 1; min-width: 0; overflow-wrap: break-word; max-height: 120px; overflow-y: auto; }
.alert-close {
  flex-shrink: 0; align-self: flex-start;
  background: none; border: none; cursor: pointer;
  color: currentColor; opacity: .45;
  font-size: 16px; line-height: 1; padding: 0 0 0 6px; margin-top: -1px;
  transition: opacity .12s;
}
.alert-close:hover { opacity: 1; }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px;
  text-align: center;
  gap: 12px;
}
.empty-icon { font-size: 36px; opacity: .4; }
.empty-title { font-size: 18px; font-weight: 600; color: var(--text-1); }
.empty-body  { font-size: 14px; color: var(--text-3); max-width: 340px; line-height: 1.6; }

/* ── Modal ───────────────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border-f);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 460px;
  box-shadow: 0 24px 48px rgba(0,0,0,.6);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 16px; font-weight: 700; color: var(--text-1); }
.modal-close {
  width: 28px; height: 28px;
  background: none; border: none;
  color: var(--text-3); cursor: pointer;
  border-radius: 4px; font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: color .1s, background .1s;
}
.modal-close:hover { color: var(--text-1); background: var(--bg-card); }

/* ── Spinner ─────────────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.2);
  border-top-color: currentColor;
  border-radius: 50%;
}
@media (prefers-reduced-motion: no-preference) {
  .spinner { animation: spin .6s linear infinite; }
}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  #root { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
  .main { padding: 20px 16px; }
}

/* ── Utilities ───────────────────────────────────────────────────────────── */
.mono { font-family: var(--font-mono); }
.text-3 { color: var(--text-3); }
.mt-2 { margin-top: 8px; }
.flex-gap { display: flex; align-items: center; gap: 8px; }

/* ── View tabs ───────────────────────────────────────────────────────────── */
.view-tabs {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.view-tab {
  padding: 10px 16px;
  background: none; border: none; cursor: pointer;
  color: var(--text-3); font-size: 14px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .12s, border-color .12s;
}
.view-tab:hover { color: var(--text-1); }
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Photo picker ────────────────────────────────────────────────────────── */
.photo-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.photo-thumb {
  position: relative; width: 84px; height: 84px;
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border); background: var(--bg-input);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-remove {
  position: absolute; top: 3px; right: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,.65); color: #fff; border: none; cursor: pointer;
  font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.photo-remove:hover { background: var(--error); }
.photo-add {
  width: 84px; height: 84px; flex-shrink: 0;
  border: 1px dashed var(--border-f); border-radius: var(--radius);
  background: var(--bg-input); color: var(--text-2); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; transition: border-color .12s, color .12s;
}
.photo-add:hover { border-color: var(--accent); color: var(--text-1); }
.photo-add-plus { font-size: 20px; line-height: 1; }

/* ── Target toggles ──────────────────────────────────────────────────────── */
.target-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.target {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; text-align: left;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); cursor: pointer;
  transition: border-color .12s, background .12s;
}
.target:hover:not(.disabled) { border-color: var(--border-f); }
.target.on { border-color: var(--accent); background: var(--accent-dim); }
.target.disabled { opacity: .5; cursor: not-allowed; }
.target:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.target-icon {
  width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
  background: var(--bg-input); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-2);
}
.target-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.target-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
.target-id { font-size: 10.5px; color: var(--text-3); }
.target-reason { font-size: 10.5px; color: var(--amber); }
.target-check {
  width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%;
  border: 1px solid var(--border-f); display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px;
}
.target-check.on { background: var(--accent); border-color: var(--accent); }

/* ── Publish actions ─────────────────────────────────────────────────────── */
.publish-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.hint-inline { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); }
.empty-inline {
  padding: 20px; border: 1px dashed var(--border); border-radius: var(--radius-lg);
  color: var(--text-3); font-size: 13px; line-height: 1.6; margin-bottom: 20px;
}

/* ── Outcomes ────────────────────────────────────────────────────────────── */
.outcome-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
}
.outcome {
  padding: 14px 16px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-card);
}
.outcome.success { border-color: rgba(34,197,94,.3); }
.outcome.error   { border-color: rgba(248,113,113,.3); }
.outcome.warning { border-color: rgba(245,158,11,.3); }
.outcome-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.outcome-ch { font-size: 13px; color: var(--text-1); font-weight: 600; }
.outcome-link { text-decoration: none; cursor: pointer; }
.outcome-link:hover { color: var(--accent); text-decoration: underline; }
.outcome-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 8px; border-radius: 20px;
}
.outcome-badge.success { background: var(--live-bg); color: var(--live); }

// ── React from CDN (no build step) ────────────────────────────────────────

const api = {
  async get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
  async post(url, body) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body ?? {}),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
  async postForm(url, formData) {
    const r = await fetch(url, { method: "POST", body: formData });
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
  async put(url, body) {
    const r = await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body ?? {}),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
  async patch(url, body) {
    const r = await fetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body ?? {}),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: "DELETE" });
    if (!r.ok) throw new Error((await r.json().catch(() => ({detail: r.statusText}))).detail);
    return r.json();
  },
};

// ── Channel monogram icons (instrument-panel style) ────────────────────────

// ── Date helpers (naive local: сохраняем как ввёл пользователь, без UTC-сдвига) ─
function _pad(n) { return String(n).padStart(2, "0"); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${_pad(d.getMonth()+1)}-${_pad(d.getDate())}`;
}
function toLocalInput(value) {
  // ISO/naive-строка → значение для <input type=datetime-local> (yyyy-MM-ddThh:mm).
  const d = new Date(value);
  return `${d.getFullYear()}-${_pad(d.getMonth()+1)}-${_pad(d.getDate())}T${_pad(d.getHours())}:${_pad(d.getMinutes())}`;

  if (state === "live") return "live";
  if (state === "needs_relogin") return "amber";

  ),

    h("path", { d:"M8 7v2.5", stroke:"currentColor", strokeWidth:1.5, strokeLinecap:"round" }),

  ),

  ),
};
const _ALERT_AUTO_MS  = { success: 5000, info: 5000 };
const _ALERT_CLOSEABLE = new Set(["success", "warning", "info"]);

function Alert({ type, children, onDismiss }) {
  const [phase, setPhase] = useState("in"); // "in" | "out" | "gone"
  const timerRef = useRef(null);

  useEffect(() => { setPhase("in"); }, [type, children]);

  useEffect(() => {
    const ms = _ALERT_AUTO_MS[type];
    if (!ms || phase !== "in") return;
    timerRef.current = setTimeout(dismiss, ms);
    return () => clearTimeout(timerRef.current);
  }, [type, phase]);

  function dismiss() {
    clearTimeout(timerRef.current);
    setPhase("out");
    setTimeout(() => { setPhase("gone"); onDismiss?.(); }, 150);
  }

  if (phase === "gone") return null;
  return h("div", {
    className: `alert ${type}${phase === "out" ? " dismissing" : ""}`,
    role: type === "error" ? "alert" : "status",
  },
    h("span", { className: "alert-icon" }, _ALERT_ICONS[type]),
    h("span", { className: "alert-body" }, children),
    _ALERT_CLOSEABLE.has(type) && h("button", {
      className: "alert-close", onClick: dismiss, "aria-label": "Закрыть",
    }, "×"),
  );
}

function Modal({ title, onClose, children }) {
  // close on Escape
  useEffect(() => {
    const handler = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", handler);
    return () => document.removeEventListener("keydown", handler);
  }, [onClose]);

  return h("div", { className: "modal-backdrop", onClick: (e) => { if (e.target === e.currentTarget) onClose(); } },
    h("div", { className: "modal", role: "dialog", "aria-modal": true, "aria-label": title },
      h("div", { className: "modal-header" },
        h("h2", { className: "modal-title" }, title),
        h("button", { className: "modal-close", onClick: onClose, "aria-label": "Закрыть" }, "×"),
      ),
      children,
    )
  );
}

// ── Мастер подключения (адаптивен под тир; шаги из декларации канала) ────────

// Нормализаторы ввода — закрытый словарь (какой применить, решает декларация).
function normalizeField(kind, raw) {
  const v = (raw ?? "").trim();
  switch (kind) {
    case "digits": return v.replace(/\D/g, "");
    case "tg_channel": {
      const s = v.replace(/^https?:\/\//i, "").replace(/^t\.me\//i, "").replace(/^@/, "").split(/[/?]/)[0];
      return s ? "@" + s : "";
    }
    case "yandex_org": {
      const m = v.match(/sprav\/(\d+)/) || v.match(/(\d{3,})/);
      return m ? m[1] : v.replace(/\D/g, "");
    }
    case "vk_group":
      return v.replace(/^https?:\/\//i, "").replace(/^(m\.|www\.)?vk\.com\//i, "").replace(/^@/, "").split(/[/?]/)[0];
    case "vk_channel_id": {
      const m = v.match(/-?\d+/); return m ? m[0] : "";
    }
    default: return v; // trim
  }
}

// Валидность поля по правилу из декларации (проверяем НОРМАЛИЗОВАННОЕ значение).
function validateField(f, raw) {
  const norm = normalizeField(f.normalize || "trim", raw);
  if (!norm) return { norm, valid: f.required === false, message: "" };  // необязательное пустое поле — ок
  if (f.pattern) {
    try {
      if (!new RegExp(f.pattern).test(norm)) {
        return { norm, valid: false, message: f.invalid_message || "Проверьте формат значения." };
      }
    } catch (_) { /* кривой паттерн из декларации — не блокируем */ }
  }
  return { norm, valid: true, message: "" };
}

function WizardFieldInput({ f, value, onChange }) {
  const [touched, setTouched] = useState(false);
  const v = value ?? "";
  const { valid, message } = validateField(f, v);
  const showError = touched && v.trim() && !valid && message;
  const showOk = touched && valid;

  function commitNormalized() {
    const norm = normalizeField(f.normalize || "trim", v);
    if (norm !== v) onChange(f.name, norm);  // автоочистка на выходе из поля
  }
  async function paste() {
    try {
      const text = await navigator.clipboard.readText();
      onChange(f.name, normalizeField(f.normalize || "trim", text));  // вставка + очистка
      setTouched(true);
    } catch (_) { /* нет доступа к буферу — вставит руками */ }
  }

  return h("div", { className: "form-group" },
    h("label", { className: "form-label", htmlFor: `wf-${f.name}` }, f.label),
    h("div", { className: "wf-row" },
      h("input", {
        id: `wf-${f.name}`,
        className: `form-input ${showError ? "wf-bad" : (showOk ? "wf-ok" : "")}`,
        type: f.secret ? "password" : "text",
        value: v,
        onChange: (e) => onChange(f.name, e.target.value),
        onBlur: () => { setTouched(true); commitNormalized(); },
        placeholder: f.placeholder || (f.secret ? "•••••••••••" : ""),
        autoComplete: "off", spellCheck: false,
        inputMode: f.normalize === "digits" ? "numeric" : undefined,
      }),
      f.paste !== false && h("button", {
        type: "button", className: "btn btn-ghost btn-sm wf-paste",
        onClick: paste, title: "Вставить из буфера обмена",
      }, "Вставить"),
    ),
    showError && h("p", { className: "wf-msg" }, message),
    f.hint && !showError && h("p", { className: "form-hint" }, f.hint),
  );
}

// Блок 4 — выход из тупика: готовое сообщение оператору с контекстом.
function operatorMessage({ title, stepTitle, err }) {
  const lines = [
    `Здравствуйте! Не получается подключить канал «${title}».`,
    `Шаг: ${stepTitle}`,
  ];
  if (err) lines.push(`Что вижу: ${err}`);
  lines.push("Подскажите, пожалуйста, что делать дальше.");
  return lines.join("\n");
}

function StuckPanel({ title, stepTitle, err, errors }) {
  const [copied, setCopied] = useState(false);
  const msg = operatorMessage({ title, stepTitle, err });
  async function copy() {
    try { await navigator.clipboard.writeText(msg); setCopied(true); }
    catch (_) { setCopied(false); }
  }
  return h("details", { className: "howto errors-help wiz-stuck" },
    h("summary", { className: "howto-summary" }, "Не получается?"),
    errors && errors.length > 0 && h("ul", { className: "errors-list" },
      errors.map((e, i) => h("li", { key: i },
        h("span", { className: "err-sym" }, e.symptom + ": "),
        h("span", { className: "err-chk" }, e.check)))),
    h("p", { className: "form-hint", style: { marginTop: "10px" } },
      "Не помогло? Скопируйте это сообщение и отправьте оператору в ваш чат:"),
    h("textarea", { className: "form-input wiz-msg", readOnly: true, rows: 4, value: msg }),
    h("button", { type: "button", className: "btn btn-ghost btn-sm mt-2", onClick: copy },
      copied ? "✓ Скопировано" : "Скопировать сообщение оператору"),
  );
}

function ConnectWizard({ channel, profileId, guide, title, onClose, onDone }) {
  const allSteps = guide?.steps || [];
  const pbase = `/api/profiles/${profileId}`;

  const [activated, setActivated] = useState(() => new Set()); // необязательные шаги (2FA)
  const [idx, setIdx] = useState(0);
  const [values, setValues] = useState({});
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [done, setDone] = useState(false);
  const [doneInfo, setDoneInfo] = useState(null);  // доп. инфо после telegraph_create
  const [browserOpened, setBrowserOpened] = useState(false);
  const [resent, setResent] = useState(false);   // код Telegram переслан заново

  const steps = allSteps.filter((s) => !s.optional || activated.has(s.key));
  const current = steps[idx];
  const M = steps.length;
  const isInteractive = channel === "telegram";

  const setVal = (name, v) => setValues((prev) => ({ ...prev, [name]: v }));

  function goNext() { setErr(null); setIdx((i) => Math.min(i + 1, M - 1)); }
  function goBack() { setErr(null); setIdx((i) => Math.max(i - 1, 0)); }

  // Перейти на необязательный шаг (напр. импорт сессии в обход входа по коду).
  function gotoAlt(key) {
    setErr(null);
    const next = new Set(activated); next.add(key); setActivated(next);
    const vis = allSteps.filter((s) => !s.optional || next.has(s.key));
    const i = vis.findIndex((s) => s.key === key);
    if (i >= 0) setIdx(i);
  }

  async function cancelFlow() {
    // Закрыть возможное открытое окно/начатый вход (best-effort).
    try {
      if (browserOpened) await api.post(`${pbase}/channels/${channel}/browser-login/cancel`);
      else if (isInteractive) await api.post(`${pbase}/channels/telegram/login/cancel`);
    } catch (_) {}
  }
  async function close() { if (!done) await cancelFlow(); onClose(); }

  function fieldsFilled(step) {
    // «Далее» доступно только когда ВСЕ поля шага валидны по формату (Блок 3).
    return (step.fields || []).every((f) => validateField(f, values[f.name]).valid);
  }

  async function runStep() {
    setBusy(true); setErr(null);
    try {
      const k = current.kind;
      if (k === "collect") {
        goNext();
      } else if (k === "tg_begin") {
        await api.post(`${pbase}/channels/telegram/login/begin`, {
          api_id: parseInt(values.api_id, 10),
          api_hash: (values.api_hash || "").trim(),
          target_channel: (values.target_channel || "").trim(),
        });
        goNext();
      } else if (k === "tg_phone") {
        await api.post(`${pbase}/channels/telegram/login/send-code`, { phone: (values.phone || "").trim() });
        goNext();
      } else if (k === "tg_code") {
        const r = await api.post(`${pbase}/channels/telegram/login/sign-in`, { code: (values.code || "").trim() });
        if (r.step === "done") setDone(true);
        else { // требуется 2FA — активируем необязательный шаг и переходим на него
          const next = new Set(activated); next.add("twofa"); setActivated(next);
          const twofaIdx = allSteps.filter((s) => !s.optional || next.has(s.key)).findIndex((s) => s.key === "twofa");
          setIdx(twofaIdx);
        }
      } else if (k === "tg_twofa") {
        const r = await api.post(`${pbase}/channels/telegram/login/sign-in`, { password: values.password || "" });
        if (r.step === "done") setDone(true);
      } else if (k === "telegraph_create") {
        const r = await api.post(`${pbase}/channels/telegraph/create-account`, {
          short_name: (values.short_name || "").trim(),
          author_name: (values.author_name || "").trim(),
          author_url: (values.author_url || "").trim(),
        });
        setDoneInfo({ author_name: r.author_name, author_url: r.author_url });
        setDone(true);
      } else if (k === "simple_connect") {
        const fd = {};
        (current.fields || []).forEach((f) => { fd[f.name] = (values[f.name] || "").trim(); });
        const r = await api.post(`${pbase}/channels/${channel}/connect`, { fields: fd });
        if (r.state === "live") setDone(true);
        else setErr("Данные сохранены, но проверка не прошла. Проверьте значение и попробуйте снова.");
      } else if (k === "browser_open") {
        await api.post(`${pbase}/channels/${channel}/browser-login/begin`);
        setBrowserOpened(true);
        goNext();
      } else if (k === "browser_confirm") {
        await api.post(`${pbase}/channels/${channel}/browser-login/confirm`);
        goNext();
      } else if (k === "target") {
        await api.put(`${pbase}/channels/${channel}/target`, { target: (values.target || "").trim() });
        setDone(true);
      } else if (k === "tg_session") {
        // Импорт готовой StringSession (обход входа по коду).
        await api.post(`${pbase}/channels/telegram/login/import-session`, {
          api_id: parseInt(values.api_id, 10),
          api_hash: (values.api_hash || "").trim(),
          target_channel: (values.target_channel || "").trim(),
          session: (values.session || "").trim(),
        });
        setDone(true);
      }
    } catch (ex) {
      setErr(ex.message);
    } finally {
      setBusy(false);
    }
  }

  // Переслать код Telegram заново (тот же send-code с сохранённым телефоном).
  async function resendCode() {
    setBusy(true); setErr(null); setResent(false);
    try {
      await api.post(`${pbase}/channels/telegram/login/send-code`, { phone: (values.phone || "").trim() });
      setResent(true);
    } catch (ex) { setErr(ex.message); }
    finally { setBusy(false); }
  }

  const ACTION_LABEL = {
    collect: "Далее", tg_begin: "Далее", tg_phone: "Отправить код",
    tg_code: "Подтвердить код", tg_twofa: "Подтвердить пароль",
    simple_connect: "Проверить и сохранить", browser_open: "Войти",
    browser_confirm: "Я вошёл", target: "Сохранить и завершить",
    tg_session: "Проверить сессию и подключить",
    telegraph_create: "Создать аккаунт",
  };

  if (done) {
    return h(Modal, { title: `Подключить · ${title}`, onClose },
      h("div", { className: "wiz-success" },
        h("div", { className: "wiz-success-ic" }, "✓"),
        h("div", { className: "wiz-success-title" }, "Готово, канал подключён"),
        doneInfo
          ? h("div", null,
              h("p", { className: "wiz-success-body" }, `Автор статей: ${doneInfo.author_name}`),
              doneInfo.author_url && h("p", { className: "wiz-success-body" },
                h("a", { href: doneInfo.author_url, target: "_blank", rel: "noopener noreferrer" }, doneInfo.author_url),
              ),
              h("p", { className: "wiz-success-body", style: { fontSize: "12px", opacity: 0.7, marginTop: "8px" } },
                "Токен сохранён зашифрованным. Восстановить его нельзя — при необходимости переподключите канал через мастер."),
            )
          : h("p", { className: "wiz-success-body" }, "Теперь можно публиковать — этот канал появится на экране «Публикация»."),
        h("button", { className: "btn btn-primary mt-2", onClick: () => { onDone("live"); onClose(); } }, "Отлично"),
      ),
    );
  }

  if (!current) {
    return h(Modal, { title: `Подключить · ${title}`, onClose },
      h(Alert, { type: "error" }, "Для этого канала пока нет мастера подключения."),
    );
  }

  const canProceed = !busy && fieldsFilled(current);
  const pct = Math.round(((idx + 1) / M) * 100);

  return h(Modal, { title: `Подключить · ${title}`, onClose: close },
    h("div", { className: "wiz-progress" },
      h("div", { className: "wiz-bar" }, h("div", { className: "wiz-bar-fill", style: { width: `${pct}%` } })),
      h("span", { className: "wiz-count" }, `Шаг ${idx + 1} из ${M}`),
    ),
    h("h3", { className: "wiz-title" }, current.title),
    current.body && h("p", { className: "wiz-body" }, current.body),

    // Блок 2 — «куда заходить»: крупная кнопка на нужный раздел + текстовый ориентир.
    current.link && h("a", { className: "wiz-link", href: current.link, target: "_blank", rel: "noopener" },
      h("span", { className: "wiz-link-ic" }, "↗"), current.link_label || "Открыть страницу"),
    current.landmark && h("div", { className: "wiz-landmark" },
      h("span", { className: "wiz-landmark-ic" }, "◎"),
      h("div", { className: "wiz-landmark-body" },
        h("span", { className: "wiz-landmark-title" }, "На той странице должно быть так:"),
        current.landmark),
    ),
    current.link && (current.fields || []).length > 0 && h("p", { className: "wiz-return" },
      "Нашли нужные значения? Вернитесь сюда и вставьте их ниже."),

    (current.fields || []).map((f) => h(WizardFieldInput, {
      key: f.name, f, value: values[f.name], onChange: setVal,
    })),

    err && h(Alert, { type: "error" }, err),

    // Альтернативный путь (напр. «У меня уже есть готовая сессия» → импорт StringSession).
    current.alt_step && current.alt_label && h("div", { style: { marginTop: "8px" } },
      h("button", { className: "wiz-alt", onClick: () => gotoAlt(current.alt_step) }, current.alt_label),
    ),

    // Пересыл кода Telegram (если шаг это объявляет).
    current.resend_label && current.kind === "tg_code" && h("div", { style: { marginTop: "8px" } },
      resent
        ? h("p", { className: "form-hint", style: { color: "var(--live)" } }, "Код отправлен заново — проверьте чат «Telegram» в приложении.")
        : h("button", { className: "btn btn-ghost btn-sm", onClick: resendCode, disabled: busy }, current.resend_label),
    ),

    h("div", { className: "wiz-actions" },
      idx > 0 && h("button", { className: "btn btn-ghost btn-sm", onClick: goBack, disabled: busy }, "← Назад"),
      h("span", { className: "wiz-spacer" }),
      h("button", { className: "btn btn-ghost btn-sm", onClick: close, disabled: busy }, "Закрыть"),
      h("button", { className: "btn btn-primary", onClick: runStep, disabled: !canProceed },
        busy && h(Spinner), busy ? " Минуту…" : (ACTION_LABEL[current.kind] || "Далее")),
    ),

    // Блок 4 — «застрял»: частые проблемы + готовое сообщение оператору.
    h(StuckPanel, { title, stepTitle: current.title, err, errors: guide?.errors }),
  );
}

// ── Target editor (per-profile цель постинга) ──────────────────────────────

function TargetEditor({ channel, profileId, label, hint, current, guide, onSaved }) {
  const [value, setValue] = useState(current || "");
  const [saving, setSaving] = useState(false);
  const [ok, setOk] = useState(false);
  useEffect(() => { setValue(current || ""); }, [current]);

  const [err, setErr] = useState(null);
  async function save() {
    const t = value.trim();
    if (!t) return;
    setSaving(true); setOk(false); setErr(null);
    try {
      const res = await api.put(`/api/profiles/${profileId}/channels/${channel}/target`, { target: t });
      // Сервер вернул НОРМАЛИЗОВАННОЕ значение (из полного URL → только имя/id).
      if (res && typeof res.target === "string") setValue(res.target);
      setOk(true);
      onSaved?.();
    } catch (ex) {
      setErr(ex.message);
    } finally { setSaving(false); }
  }

  const dirty = value.trim() !== (current || "");
  return h("div", { className: "target-editor" },
    h("label", { className: "form-label", htmlFor: `tgt-${channel}` }, label || "Цель постинга"),
    h("div", { className: "target-row" },
      h("input", {
        id: `tgt-${channel}`, className: "form-input mono", value,
        onChange: (e) => { setValue(e.target.value); setOk(false); },
        placeholder: hint || "", spellCheck: false, autoComplete: "off",
      }),
      h("button", {
        className: "btn btn-ghost btn-sm", onClick: save,
        disabled: saving || !value.trim() || !dirty,
      }, saving ? h(Spinner) : (ok && !dirty ? "✓" : "Сохранить")),
    ),
    hint && h("p", { className: "form-hint" }, hint),
    h(FieldHowTo, { guide, field: "target" }),
    err && h("p", { className: "form-hint", style: { color: "var(--error)" } }, err),
    !current && h("p", { className: "form-hint", style: { color: "var(--amber)" } },
      "Без цели канал недоступен для публикации — у каждого клиента своя группа."),
  );
}

// Строим URL канала по target-значению (адрес/id) — для кнопки «Открыть канал».
function channelUrl(channel, target) {
  if (!target) return null;
  const t = String(target).trim();
  if (!t) return null;
  switch (channel) {
    case "telegram":   return `https://t.me/${t.replace(/^@/, "")}`;
    case "vk_wall":    return `https://vk.com/${t.replace(/^@/, "")}`;
    case "vk_channel": return `https://vk.ru/im/channels/${t.startsWith("-") ? t : "-" + t}`;
    case "yandex":     return `https://yandex.ru/maps/org/${t}`;
    case "telegraph":  return `https://telegra.ph`;
    default:           return null;
  }
}

function ChannelCard({ ch, profileId, onRefresh, focus }) {
  const [validating, setValidating] = useState(false);
  const [wizard, setWizard] = useState(false);   // открыт мастер подключения
  const [resetConfirm, setResetConfirm] = useState(false);
  const [msg, setMsg] = useState(null);
  const cardRef = useRef(null);

  const state = ch.state;
  const cardClass = `channel-card ${state === "live" ? "live-card" : state === "needs_relogin" ? "amber-card" : ""}${focus ? " focus" : ""}`;

  // Переход из консоли ошибок: подсветить и прокрутить к нужному каналу.
  useEffect(() => {
    if (focus && cardRef.current) cardRef.current.scrollIntoView({ block: "center", behavior: "smooth" });
  }, [focus]);

  async function handleValidate() {
    setValidating(true); setMsg(null);
    try {
      const res = await api.post(`/api/profiles/${profileId}/channels/${ch.channel}/validate`);
      setMsg({ type: res.state === "live" ? "success" : "warning", text: res.message });
      onRefresh();
    } catch (ex) {
      setMsg({ type: "error", text: ex.message });
    } finally {
      setValidating(false);
    }
  }

  // Сброс входа: удалить учётку канала у профиля → «не подключён».
  async function handleDisconnect() {
    setResetConfirm(false); setMsg(null);
    try {
      const res = await api.post(`/api/profiles/${profileId}/channels/${ch.channel}/disconnect`);
      setMsg({ type: "info", text: res.message || "Вход сброшен." });
      onRefresh();
    } catch (ex) {
      setMsg({ type: "error", text: ex.message });
    }
  }

  const hasSession = state === "live" || ch.has_credential;
  const icon = CHANNEL_ICONS[ch.channel] ?? ch.channel.slice(0, 2).toUpperCase();
  const connectLabel = ch.has_credential ? "Переподключить" : (ch.kind === "browser" ? "Войти" : "Подключить");

  return h("div", { className: cardClass, ref: cardRef },
    h("div", { className: "card-header" },
      h("div", { className: "card-icon", "aria-hidden": true }, icon),
      h("div", { className: "card-names" },
        h("div", { className: "card-title" }, ch.title || ch.channel),
        h("div", { className: "card-id" }, `id: ${ch.channel}`),
      ),
      h("span", { className: "card-tier" }, ch.kind),
    ),
    h("div", { className: "status-row" },
      h(Lamp, { state }),
      h("span", { className: `status-label ${lampClass(state)} mono` }, stateLabel(state)),
    ),
    // per-profile цель постинга (группа/организация) — своя у каждого клиента.
    // Мастер задаёт её при подключении; здесь можно поправить в любой момент.
    ch.needs_target && h(TargetEditor, {
      channel: ch.channel, profileId,
      label: ch.target_label, hint: ch.target_hint, current: ch.target,
      guide: ch.guide, onSaved: onRefresh,
    }),
    msg && h(Alert, { type: msg.type }, msg.text),
    h("div", { className: "card-actions" },
      // Единая кнопка подключения → пошаговый мастер (адаптивен под тир).
      state !== "live"
        ? h("button", { className: "btn btn-primary btn-sm", onClick: () => { setMsg(null); setWizard(true); } },
            connectLabel)
        : null,
      // Ссылка «Открыть канал» — только когда target задан и URL понятен.
      (() => { const url = channelUrl(ch.channel, ch.target); return url
        ? h("a", { href: url, target: "_blank", rel: "noopener", className: "btn btn-ghost btn-sm" }, "↗ Открыть канал")
        : null; })(),
      hasSession && !resetConfirm
        ? h("button", { className: "btn btn-ghost btn-sm", onClick: handleValidate, disabled: validating },
            validating && h(Spinner), validating ? "Проверяю…" : "Проверить")
        : null,
      hasSession && !resetConfirm
        ? h("button", { className: "btn btn-danger btn-sm", onClick: () => setResetConfirm(true) }, "Сбросить вход")
        : null,
      resetConfirm
        ? h("button", { className: "btn btn-danger btn-sm", onClick: handleDisconnect }, "Подтвердить сброс")
        : null,
      resetConfirm
        ? h("button", { className: "btn btn-ghost btn-sm", onClick: () => setResetConfirm(false) }, "Отмена")
        : null,
    ),
    resetConfirm && (ch.channel === "vk_wall" || ch.channel === "vk_channel")
      ? h("p", { className: "form-hint", style: { marginTop: "4px" } },
          "ВК-стена и ВК-канал делят один вход — сброс затронет оба.")
      : null,
    wizard && h(ConnectWizard, {
      channel: ch.channel,
      profileId,
      guide: ch.guide,
      title: ch.title || ch.channel,
      onClose: () => setWizard(false),
      onDone: () => { setWizard(false); onRefresh(); },
    }),
  );
}

const LOG_PAGE = 20;
// Пресеты периода: метка → сколько назад в мс (null = за всё время).
const PERIODS = [["24h", "24 часа", 864e5], ["7d", "7 дней", 6048e5], ["30d", "30 дней", 2592e6], ["all", "всё время", null]];

function fmtLogTime(iso) {
  const d = new Date(iso);
  return `${_pad(d.getDate())}.${_pad(d.getMonth()+1)} ${_pad(d.getHours())}:${_pad(d.getMinutes())}`;
}

// from_time для выбранного пресета. Считаем в компоненте (не в модуле): Date.now живой.
function periodFrom(preset) {
  const span = (PERIODS.find(p => p[0] === preset) || [])[2];
  if (span == null) return "";
  const d = new Date(Date.now() - span);
  // naive-local ISO (без Z): бэкенд сравнивает по локальному created_at.
  return `${d.getFullYear()}-${_pad(d.getMonth()+1)}-${_pad(d.getDate())}T${_pad(d.getHours())}:${_pad(d.getMinutes())}:${_pad(d.getSeconds())}`;
}

function ErrorConsole({ profiles, onGoToProfile }) {
  const [rows, setRows] = useState([]);
  const [summary, setSummary] = useState(null);
  const [more, setMore] = useState(false);
  const [err, setErr] = useState(null);
  const [onlyProblems, setOnlyProblems] = useState(true);
  const [profileId, setProfileId] = useState("");
  const [channel, setChannel] = useState("");
  const [level, setLevel] = useState("");
  const [period, setPeriod] = useState("7d");

  // Строка query из активных фильтров (без курсора). from_time считается по пресету.
  const filterQS = useCallback((extra = {}) => {
    const p = new URLSearchParams();
    p.set("only_problems", onlyProblems ? "true" : "false");
    if (profileId) p.set("profile_id", profileId);
    if (channel) p.set("channel", channel);
    if (level) p.set("level", level);
    const from = periodFrom(period);
    if (from) p.set("from_time", from);
    for (const [k, v] of Object.entries(extra)) p.set(k, v);
    return p.toString();
  }, [onlyProblems, profileId, channel, level, period]);

  const load = useCallback(async () => {
    setErr(null);
    try {
      const [feed, sum] = await Promise.all([
        api.get(`/api/admin/logs?${filterQS({ limit: LOG_PAGE })}`),
        api.get(`/api/admin/logs/summary${periodFrom(period) ? `?from_time=${encodeURIComponent(periodFrom(period))}` : ""}`),
      ]);
      setRows(feed);
      setMore(feed.length === LOG_PAGE);
      setSummary(sum);
    } catch (ex) { setErr(ex.message); }
  }, [filterQS, period]);

  // Инкремент: тянем только записи новее самого свежего курсора (since).
  const loadDelta = useCallback(async () => {
    if (rows.length === 0) return load();
    try {
      const fresh = await api.get(`/api/admin/logs?${filterQS({ since: rows[0].cursor, limit: LOG_PAGE })}`);
      if (fresh.length) {
        setRows(prev => [...fresh, ...prev]);
        api.get(`/api/admin/logs/summary${periodFrom(period) ? `?from_time=${encodeURIComponent(periodFrom(period))}` : ""}`).then(setSummary).catch(() => {});
      }
    } catch (_) {}
  }, [filterQS, period, rows, load]);

  async function loadMore() {
    try {
      const older = await api.get(`/api/admin/logs?${filterQS({ before: rows[rows.length-1].cursor, limit: LOG_PAGE })}`);
      setRows(prev => [...prev, ...older]);
      setMore(older.length === LOG_PAGE);
    } catch (ex) { setErr(ex.message); }
  }

  // Перезагрузка при смене фильтров.
  useEffect(() => { load(); }, [load]);

  // Поллинг только при видимой вкладке (Page Visibility): инкремент каждые 15 сек.
  useEffect(() => {
    let timer = null;
    const start = () => { if (!timer) timer = setInterval(loadDelta, 15000); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
    const onVis = () => {
      if (document.visibilityState === "visible") { loadDelta(); start(); } else stop();
    };
    document.addEventListener("visibilitychange", onVis);
    if (document.visibilityState === "visible") start();
    return () => { document.removeEventListener("visibilitychange", onVis); stop(); };
  }, [loadDelta]);

  return h("div", null,
    h("h1", { className: "page-title" }, "Консоль ошибок"),
    h("p", { className: "page-subtitle" }, "ПРОБЛЕМЫ ПО ВСЕМ КЛИЕНТАМ"),

    summary && h("div", { className: "console-summary" },
      h("div", { className: "console-stat" },
        h("span", { className: "console-stat-num" }, summary.clients_with_problems),
        h("span", { className: "console-stat-label" }, "клиентов с проблемами"),
      ),
      h("div", { className: "console-stat", style: { flex: "1 1 auto" } },
        h("span", { className: "console-stat-label" }, "падают чаще"),
        h("div", { className: "console-chan-stats" },
          summary.channels.length === 0
            ? h("span", { className: "text-3" }, "— нет сбоев за период")
            : summary.channels.map(cs => h("span", { className: "console-chan-pill", key: cs.channel },
                (CHANNEL_ICONS[cs.channel] || cs.channel), h("b", null, cs.count))),
        ),
      ),
    ),

    h("div", { className: "console-filters" },
      h("label", { className: "console-toggle" },
        h("input", { type: "checkbox", checked: onlyProblems,
          onChange: e => setOnlyProblems(e.target.checked) }),
        "только проблемы",
      ),
      h("select", { className: "form-input", value: profileId, onChange: e => setProfileId(e.target.value) },
        h("option", { value: "" }, "все клиенты"),
        profiles.map(p => h("option", { key: p.id, value: p.id }, p.name)),
      ),
      h("input", { className: "form-input", type: "text", placeholder: "канал",
        value: channel, onChange: e => setChannel(e.target.value.trim()) }),
      h("select", { className: "form-input", value: level, onChange: e => setLevel(e.target.value) },
        h("option", { value: "" }, "любой уровень"),
        ["ERROR", "WARNING", "INFO"].map(l => h("option", { key: l, value: l }, l)),
      ),
      h("select", { className: "form-input", value: period, onChange: e => setPeriod(e.target.value) },
        PERIODS.map(([id, label]) => h("option", { key: id, value: id }, label)),
      ),
    ),

    err && h(Alert, { type: "error" }, err),
    rows.length === 0 && !err
      ? h("div", { className: "empty-state" },
          h("span", { className: "empty-icon" }, "✓"),
          h("h2", { className: "empty-title" }, "Проблем не найдено"),
          h("p", { className: "empty-body" }, "За выбранный период сбоев нет. Расширьте период или снимите «только проблемы»."))
      : h("div", { className: "log-rows" },
          rows.map(row => h(LogRow, { key: row.id, row, onGoToProfile })),
        ),
    more && h("div", { className: "report-more" },
      h("button", { className: "btn btn-ghost btn-sm", onClick: loadMore }, "Показать ещё"),
    ),
  );
}

const OUTCOME_META = {
  done:          { cls: "success", label: "Опубликовано" },
  submitted:     { cls: "warning", label: "На модерации" },
  attempting:    { cls: "info",    label: "Публикую…" },

function PhotoPicker({ files, onChange }) {
  const inputRef = useRef(null);
  const previews = files.map((f) => ({ name: f.name, url: URL.createObjectURL(f) }));

  function add(e) {
    const picked = Array.from(e.target.files || []);
    onChange([...files, ...picked]);
    e.target.value = "";  // позволить выбрать тот же файл снова
  }
  function remove(i) { onChange(files.filter((_, idx) => idx !== i)); }

  return h("div", null,
    h("div", { className: "photo-grid" },
      previews.map((p, i) => h("div", { key: i, className: "photo-thumb" },
        h("img", { src: p.url, alt: p.name }),
        h("button", { type: "button", className: "photo-remove", onClick: () => remove(i), "aria-label": "Убрать" }, "×"),
      )),
      h("button", { type: "button", className: "photo-add", onClick: () => inputRef.current?.click() },
        h("span", { className: "photo-add-plus" }, "+"),
        h("span", null, "Фото"),
      ),
    ),
    h("input", {
      ref: inputRef, type: "file", accept: "image/*", multiple: true,
      style: { display: "none" }, onChange: add,
    }),
  );
}

  const disabled = !t.eligible;
  return h("button", {
    type: "button",
    className: `target ${checked ? "on" : ""} ${disabled ? "disabled" : ""}`,
    onClick: disabled ? undefined : () => onToggle(t.channel),
    disabled,
    title: disabled ? t.reason : "",
    "aria-pressed": checked,

    h("span", { className: "target-icon" }, icon),
    h("span", { className: "target-body" },

    h("span", { className: `target-check ${checked ? "on" : ""}` }, checked ? "✓" : ""),
