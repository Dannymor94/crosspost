name: UX prototype visual review
on:
  push:
    branches: [task/T-509-ux-prototype]
    paths:
      - 'prototypes/ux-00/**'
      - '.github/workflows/ux-prototype-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra browser --extra infra --extra crypto
      - run: uv run playwright install chromium --with-deps
      - name: Show exact formatter diff (diagnostics)
        if: always()
        run: uv run ruff format --diff tests/test_ux_prototype_isolation.py
        continue-on-error: true
      - name: Prototype behavioral tests
        run: uv run pytest -q tests/test_ux_prototype_isolation.py
      - name: Capture screenshots
        if: always()
        run: uv run python prototypes/ux-00/capture_visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crosspost-ux-visual-review
          path: prototypes/ux-00/visual-output/*.png
          retention-days: 7
          if-no-files-found: warn
