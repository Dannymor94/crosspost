name: UX browser acceptance (mocked client)

on:
  push:
    branches:
      - integration/ux01-t215-t218
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UX_BROWSER_ASSETS: ${{ runner.temp }}/ux-browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra browser --extra infra --extra crypto
      - name: Install Chromium
        run: uv run playwright install chromium --with-deps
      - name: Install exact client library versions without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/ux-browser" --no-save --ignore-scripts --no-audit --no-fund preact@10.24.3 htm@3.1.1
      - name: Run actual client editor in Chromium
        run: uv run pytest -q tests/web/test_client_editor_acceptance.py
