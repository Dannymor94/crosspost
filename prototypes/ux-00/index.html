document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const [a,v]=b.dataset.action.split(":");const p=posts.find(x=>x.id===Number(v));switch(a){case"go":go(v);break;case"new":go("editor");break;case"metric":filter=v;query="";go("posts");break;case"new-on":selectedDate=v;draft().date=v;draft().when="later";go("editor");break;case"new-date":draft().date=selectedDate;draft().when="later";go("editor");break;case"close":$("dialog").close();break;case"detail":details(p);break;case"filter":filter=v;render();break;case"mode":mode=v;if(v==="week"){const day=(new Date(selectedDate+"T12:00:00Z").getUTCDay()+6)%7;weekStart=shift(selectedDate,-day)}else if(v==="month"){const x=new Date(selectedDate+"T12:00:00Z");year=x.getUTCFullYear();month=x.getUTCMonth()}render();break;case"date":selectedDate=v;render();break;case"cal-prev":case"cal-next":{const n=a==="cal-prev"?-1:1;if(mode==="month"){const x=new Date(Date.UTC(year,month+n,1));year=x.getUTCFullYear();month=x.getUTCMonth();selectedDate=iso(year,month,1)}else{weekStart=shift(weekStart,n*7);selectedDate=weekStart;const x=new Date(weekStart+"T12:00:00Z");year=x.getUTCFullYear();month=x.getUTCMonth()}render();break}case"cal-today":year=2026;month=10;weekStart="2026-11-23";selectedDate=date0;render();break;case"all-targets":draft().targets=targets.filter(t=>eligible(t,draft())).map(t=>t.id);render();break;case"no-targets":draft().targets=[];render();break;case"clear-media":setMedia("","none");break;case"pick-demo":go("media");break;case"media":setMedia(["Афиша.jpg","Практика.mp4","Логотип.png"][Number(v)],v==="1"?"video":"image");go("editor");break;case"preview":showDialog("Приблизительный предпросмотр",'<div class="detail preview">'+esc(draft().text||"Нет текста")+'</div><small>'+esc(draft().media)+'</small><p>Выбрано площадок: '+draft().targets.length+'</p><small>Внешний вид на реальных площадках может отличаться.</small>');break;case"submit":submit();break;case"edit":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();drafts.set(key(),{text:p.text,media:p.media||"",kind:p.media?.endsWith(".mp4")?"video":"none",targets:[...p.targets],when:"later",date:p.date,time:p.time,id:p.id});go("editor")}break;case"cancel-confirm":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();showDialog("Отменить публикацию?",'<p>Пост не будет отправлен (демо).</p>'+button("Подтвердить отмену","cancel:"+p.id,"danger"))}break;case"cancel":if(p&&p.profile===profile&&p.status==="scheduled"){p.status="cancelled";$("dialog").close();render();toast("Пост отменён (демо)")}break;case"approve":case"reject":if(role==="admin"&&p?.status==="pending"){if(a==="reject"&&!$("reason").value.trim()){toast("Укажите причину отклонения");break}p.status=a==="approve"?"scheduled":"rejected";if(a==="reject")p.reason=$("reason").value.trim();$("dialog").close();render();toast("Решение сохранено (демо)")}break;case"client":if(role==="admin"&&names[v]){profile=v;$("profile").value=v;go("home")}break;case"connect":if(role==="admin"&&connections[profile][v]){connections[profile][v]="live";render();toast("Демонстрационная проверка выполнена")}break;case"retry-read":scenario="normal";render();break;case"reset":location.reload();break;}});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="post-text"){draft().text=el.value;$("count").textContent=el.value.length+" символов"}if(el.id==="search"){query=el.value;const pos=el.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const el=e.target;if(el.id==="role"){role=el.value;profile=role==="client"?"studio":$("profile").value;filter="all";query="";go("home")}else if(el.id==="profile"&&role==="admin"){profile=el.value;filter="all";query="";go("home")}else if(el.id==="file"){const f=el.files[0];if(f)setMedia(f.name,f.type.startsWith("video/")?"video":"image")}else if(el.dataset.target){const d=draft(),id=el.dataset.target;if(el.checked&&eligible(targets.find(t=>t.id===id),d))d.targets=[...new Set([...d.targets,id])];else d.targets=d.targets.filter(x=>x!==id);render();document.querySelector('[data-target="'+id+'"]')?.focus()}else if(["when","date","time"].includes(el.id)){draft()[el.id]=el.value;if(el.id==="when"){if(draft().id&&el.value==="now"){draft().when="later";toast("Для существующего поста доступно только изменение расписания.")}render()}}else if(el.id==="cal-platform"){calendarPlatform=el.value;render()}else if(el.id==="cal-status"){calendarStatus=el.value;render()}else if(el.id==="scenario"){scenario=el.value;toast("Сценарий выбран")}});
$("collapse").addEventListener("click",()=>{collapsed=!collapsed;renderNav()});$("theme").addEventListener("click",()=>{theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;renderNav()});render();
</script></body></html>
