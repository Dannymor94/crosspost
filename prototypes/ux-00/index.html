const setupKeys=Object.keys(setupGuides);

function inviteView(){return heading("Пригласить клиента","Администратор · демонстрация")+'<section class="panel stack onboarding"><h2>Новый клиент</h2><label>Название рабочего пространства<input id="invite-name" placeholder="Название компании" value="Новый клиент (демо)"></label><p>Роль: клиент. Доступ только к собственному профилю. Клиент сам задаёт пароль.</p>'+button("Создать приглашение (демо)","make-invite","primary")+(inviteReady?'<div class="notice">Приглашение создано в памяти. Настоящая ссылка не генерируется. '+button("Открыть как клиент","open-invite","primary")+'</div>':"")+'</section>'}

function acceptView(){if(!inviteReady||inviteAccepted)return authWrap('<h1>Приглашение недоступно</h1><p>Попросите администратора выдать новое приглашение.</p>'+button("Ко входу","go:login","primary"));return authWrap('<small>Шаг 1 из 2 · приглашение (демо)</small><h1>Создайте аккаунт</h1><p>Вас пригласили в рабочее пространство «'+esc(names.newdemo)+'».</p><form id="register-form"><label>Логин<input id="demo-login" value="demo-client" autocomplete="off" spellcheck="false"></label>'+passwordField("register-pass","Пароль")+passwordField("register-confirm","Повторите пароль")+authAlert()+'<small>В демо используйте только crosspost-demo. В рабочей версии вы зададите собственный пароль.</small><button type="submit" class="primary">Создать аккаунт (демо)</button></form>'+button("Уже есть аккаунт? Войти","go:login","subtle"))}
function demoSignIn(asAdmin=false){const login=asAdmin?"demo-admin":$("login-name")?.value.trim(),password=asAdmin?"crosspost-demo":$("login-pass")?.value;if(password!=="crosspost-demo"||![demoLogin,"demo-admin"].includes(login)){authError="Не удалось войти. Проверьте демонстрационный логин и пароль.";render();return}role=login==="demo-admin"?"admin":"client";profile=role==="admin"?$("profile").value:clientProfile;$("role").value=role;filter="all";query="";go("home")}

function wizard(){const g=setupGuides[setupPlatform];if(!g)return onboard();const s=g.steps[setupStep];return '<section class="panel stack onboarding guide"><div class="row spread">'+button("Назад","setup-back","subtle")+'<small>Шаг '+(setupStep+1)+' из '+g.steps.length+'</small></div><h1>'+esc(g.name)+'</h1><div class="stepbar"><span style="width:'+((setupStep+1)/g.steps.length*100)+'%"></span></div><h2>'+esc(s[0])+'</h2><p>'+esc(s[1])+'</p><div class="detail"><small>Что искать</small><p>'+esc(s[2])+'</p></div><details><summary>Не получается?</summary><p>'+esc(g.help)+'</p></details><div class="notice">Демо: никаких сетевых запросов, секретов и реальных подключений.</div>'+button(setupStep===g.steps.length-1?"Симулировать успешную проверку":"Далее","setup-next","primary")+button("Отмена","setup-cancel","subtle")+'</section>'}
function importView(){return heading("Импорт контент-плана","Демонстрация будущего маршрута")+'<section class="panel stack"><h2>1. Источник → 2. Сопоставление → 3. Проверка</h2><p>Существующий импорт Google Sheets, XLSX и CSV будет сохранён. В UX-00 файлы не разбираются и записи не создаются.</p>'+button("К контент-плану","go:calendar")+'</section>'}
function render(){renderNav();const auth=authPages.has(page);document.querySelector(".shell").classList.toggle("auth-shell",auth);$("mobile").hidden=auth;const f={home,editor,posts:publications,calendar,moderation,clients,connections:connectionView,more,media,import:importView,onboard,wizard,invite:inviteView,accept:acceptView,login:loginView,recover:recoverView}[page]||home;$("view").innerHTML='<div class="banner">'+icon("info")+'Демонстрационный прототип · без реальных отправок</div>'+f()}
function details(p){if(!p||(role==="client"&&p.profile!==profile))return;let body='<small>'+esc(names[p.profile])+' · '+dateStr(p.date)+' · '+esc(p.time)+'</small>'+showStatus(p.status)+'<div class="detail preview">'+esc(p.text)+'</div>';if(p.reason)body+='<div class="notice">'+esc(p.reason)+'</div>';body+=p.targets.map(t=>'<div class="row spread"><span>'+esc(targets.find(x=>x.id===t)?.name||t)+'</span>'+showStatus(p.outcomes?.[t]||p.status)+'</div>').join("");if(p.status==="scheduled"&&p.profile===profile)body+='<div class="actions">'+button("Изменить","edit:"+p.id)+button("Отменить пост","cancel-confirm:"+p.id,"danger")+'</div>';if(p.status==="pending"&&role==="admin")body+='<label>Причина отклонения<textarea id="reason" rows="2" placeholder="Укажите, что исправить"></textarea></label><div class="actions">'+button("Отклонить","reject:"+p.id,"danger")+button("Одобрить","approve:"+p.id,"primary")+'</div>';if(["submitted","partial","unknown"].includes(p.status))body+='<div class="notice">Неподтверждённая отправка не считается успехом. Повтор недоступен.</div>';showDialog("Публикация",body)}
function setMedia(n,kind){const d=draft();d.media=n;d.kind=kind;const before=d.targets.length;d.targets=d.targets.filter(id=>eligible(targets.find(t=>t.id===id),d));if(before!==d.targets.length)toast("Недоступная цель снята. Новые цели не добавлены.");render()}
function submit(){const d=draft();if(!d.text.trim()&&!d.media){notice="Добавьте текст или медиа.";render();return}if(!d.targets.length){notice="Выберите хотя бы одну площадку.";render();return}if(d.targets.some(id=>!targets.some(t=>t.id===id&&eligible(t,d)))){notice="Одна из выбранных площадок недоступна. Уточните выбор.";render();return}if(d.when==="later"&&(!d.date||!d.time||(d.date<date0||d.date===date0&&d.time<"12:00"))){notice="Укажите допустимые дату и время.";render();return}if(d.id&&d.when!=="later"){notice="При редактировании расписания выберите дату и время.";render();return}if(d.id&&!own().some(p=>p.id===d.id&&p.status==="scheduled")){notice="Пост уже изменился. Откройте его заново.";render();return}const pending=role==="client"&&profile==="studio";let st=pending?"pending":d.when==="later"?"scheduled":"done",outcomes;if(st==="done"){outcomes=Object.fromEntries(d.targets.map((t,i)=>[t,scenario==="unknown"?"unknown":scenario==="mixed"?i===0?"submitted":i===1?"failed":"done":"done"]));if(scenario==="unknown")st="unknown";else if(scenario==="mixed")st=d.targets.length===1?"submitted":"partial"}const p={id:d.id||++seq,profile,text:d.text,date:d.when==="later"?d.date:date0,time:d.when==="later"?d.time:"12:00",status:st,targets:[...d.targets],media:d.media,outcomes};posts=d.id?posts.map(x=>x.id===d.id?p:x):[p,...posts];drafts.delete(key());filter="all";query="";scenario="normal";go("posts");details(p);toast("Демонстрация: "+status[st][1])}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const [a,v]=b.dataset.action.split(":");const p=posts.find(x=>x.id===Number(v));switch(a){case"go":go(v);break;case"logout":go("login");break;case"login-admin":demoSignIn(true);break;case"auth-theme":theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;break;case"toggle-pass":{const el=$(v);if(el&&["login-pass","register-pass","register-confirm"].includes(v)){el.type=el.type==="password"?"text":"password";b.setAttribute("aria-label",el.type==="password"?"Показать пароль":"Скрыть пароль")}break;}case"invite":if(role==="admin"){inviteReady=false;go("invite")}break;case"make-invite":if(role==="admin"){inviteAccepted=false;names.newdemo=$("invite-name").value.trim()||"Новый клиент (демо)";inviteReady=true;render()}break;case"open-invite":if(role==="admin"&&inviteReady&&!inviteAccepted)go("accept");break;case"start-onboard":role="client";clientProfile="newdemo";profile=clientProfile;$("role").value="client";setupActive=true;go("onboard");break;case"setup":if(setupGuides[v]){setupPlatform=v;setupStep=0;setupOrigin=page==="connections"?"connections":"onboard";go("wizard")}break;case"setup-back":if(setupStep>0){setupStep--;render()}else go(setupOrigin);break;case"setup-cancel":go(setupOrigin);break;case"setup-next":if(setupStep<setupGuides[setupPlatform].steps.length-1){setupStep++;render()}else{if(setupPlatform==="te")setupDone.add(profile+":te");else connections[profile][setupPlatform]="live";go(setupOrigin);toast("Подключено (демо)")}break;case"finish-setup":setupActive=false;go("home");break;case"finish-create":setupActive=false;go("editor");break;case"new":go("editor");break;case"metric":filter=v;query="";go("posts");break;case"new-on":selectedDate=v;draft().date=v;draft().when="later";go("editor");break;case"new-date":draft().date=selectedDate;draft().when="later";go("editor");break;case"close":$("dialog").close();break;case"detail":details(p);break;case"filter":filter=v;render();break;case"mode":mode=v;if(v==="week"){const day=(new Date(selectedDate+"T12:00:00Z").getUTCDay()+6)%7;weekStart=shift(selectedDate,-day)}else if(v==="month"){const x=new Date(selectedDate+"T12:00:00Z");year=x.getUTCFullYear();month=x.getUTCMonth()}render();break;case"date":selectedDate=v;render();break;case"cal-prev":case"cal-next":{const n=a==="cal-prev"?-1:1;if(mode==="month"){const x=new Date(Date.UTC(year,month+n,1));year=x.getUTCFullYear();month=x.getUTCMonth();selectedDate=iso(year,month,1)}else{weekStart=shift(weekStart,n*7);selectedDate=weekStart;const x=new Date(weekStart+"T12:00:00Z");year=x.getUTCFullYear();month=x.getUTCMonth()}render();break}case"cal-today":year=2026;month=10;weekStart="2026-11-23";selectedDate=date0;render();break;case"all-targets":draft().targets=targets.filter(t=>eligible(t,draft())).map(t=>t.id);render();break;case"no-targets":draft().targets=[];render();break;case"clear-media":setMedia("","none");break;case"pick-demo":go("media");break;case"media":setMedia(["Афиша.jpg","Практика.mp4","Логотип.png"][Number(v)],v==="1"?"video":"image");go("editor");break;case"preview":showDialog("Приблизительный предпросмотр",'<div class="detail preview">'+esc(draft().text||"Нет текста")+'</div><small>'+esc(draft().media)+'</small><p>Выбрано площадок: '+draft().targets.length+'</p><small>Внешний вид на реальных площадках может отличаться.</small>');break;case"submit":submit();break;case"edit":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();drafts.set(key(),{text:p.text,media:p.media||"",kind:p.media?.endsWith(".mp4")?"video":"none",targets:[...p.targets],when:"later",date:p.date,time:p.time,id:p.id});go("editor")}break;case"cancel-confirm":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();showDialog("Отменить публикацию?",'<p>Пост не будет отправлен (демо).</p>'+button("Подтвердить отмену","cancel:"+p.id,"danger"))}break;case"cancel":if(p&&p.profile===profile&&p.status==="scheduled"){p.status="cancelled";$("dialog").close();render();toast("Пост отменён (демо)")}break;case"approve":case"reject":if(role==="admin"&&p?.status==="pending"){if(a==="reject"&&!$("reason").value.trim()){toast("Укажите причину отклонения");break}p.status=a==="approve"?"scheduled":"rejected";if(a==="reject")p.reason=$("reason").value.trim();$("dialog").close();render();toast("Решение сохранено (демо)")}break;case"client":if(role==="admin"&&names[v]){profile=v;if(!Array.from($("profile").options).some(o=>o.value===v))$("profile").add(new Option(names[v],v));$("profile").value=v;go("home")}break;case"connect":if(role==="admin"&&connections[profile][v]){connections[profile][v]="live";render();toast("Демонстрационная проверка выполнена")}break;case"retry-read":scenario="normal";render();break;case"reset":location.reload();break;}});

document.addEventListener("input",e=>{const el=e.target;if(el.id==="post-text"){draft().text=el.value;$("count").textContent=el.value.length+" символов"}if(el.id==="search"){query=el.value;const pos=el.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)}});
