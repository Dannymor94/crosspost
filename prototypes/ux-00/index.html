<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,textarea,select{min-height:44px}button{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}button:hover:not(:disabled){border-color:var(--accent)}button.primary{background:#4f46e5;color:white;border-color:#4f46e5;font-weight:650}button.subtle{background:transparent}button.danger{color:var(--bad)}button.active{background:var(--soft);color:var(--accent);font-weight:650}input,textarea,select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:11px}input[type=checkbox]{width:20px;min-height:20px;accent-color:#4f46e5}textarea{resize:vertical;min-height:130px}label{display:block;font-size:14px;font-weight:600}label>input,label>textarea,label>select{display:block;margin-top:7px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,34px);letter-spacing:-.035em;line-height:1.2}h2{font-size:20px;letter-spacing:-.02em}h3{font-size:16px}small,.muted{color:var(--muted)}small{font-size:13px}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}.side{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:750;letter-spacing:-.045em}.mark{display:grid;place-items:center;background:#4f46e5;color:white;width:36px;height:36px;border-radius:11px;font-size:20px}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;display:flex;gap:12px;align-items:center;background:transparent}.nav button.active{background:var(--soft)}.side .foot{margin-top:auto}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}.top select{width:auto;max-width:100%}.toolbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.wrap{max-width:1160px;margin:auto;padding:28px;display:grid;gap:24px}.banner{background:var(--soft);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;color:var(--ink)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}.stack{display:grid;gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric b{display:block;font-size:30px;letter-spacing:-.05em}.list{display:grid;gap:0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);min-width:0}.item:last-child{border:0}.item>div:first-child{min-width:0;overflow-wrap:anywhere}.status{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:650;color:var(--muted)}.status.good{color:var(--good)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.platform{display:inline-flex;align-items:center;gap:8px}.avatar{display:inline-grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:800}.target{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:58px}.target>span:nth-child(2){flex:1}.target.disabled{opacity:.7;cursor:not-allowed}.target input{display:inline;margin:0}.editor{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal button{min-width:0;padding:7px 4px;min-height:64px;text-align:left;font-size:13px;overflow-wrap:anywhere}.cal .blank{min-height:40px}.daylabel{text-align:center;font-size:12px;color:var(--muted)}.dot{display:block;font-size:11px;color:var(--accent);margin-top:3px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:13px;padding:5px 10px;min-height:44px}.error{color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:12px}.notice{color:var(--warn);border:1px solid var(--line);border-radius:10px;padding:12px}.empty{padding:22px;text-align:center;color:var(--muted)}.detail{padding:12px;border:1px solid var(--line);border-radius:10px}.mobile{display:none}.preview{white-space:pre-wrap;overflow-wrap:anywhere}.file{overflow-wrap:anywhere}dialog{width:min(520px,calc(100vw - 32px));max-height:85dvh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:22px;box-shadow:0 14px 50px #0003}dialog::backdrop{background:#11182788}#toast{min-height:0}#toast:not(:empty){position:fixed;bottom:24px;right:24px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:0 10px 36px #0002;max-width:calc(100vw - 48px)}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;z-index:9;background:var(--panel);padding:12px}
@media(max-width:900px){.shell{grid-template-columns:190px minmax(0,1fr)}.side{padding:20px 12px}.wrap{padding:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.editor{grid-template-columns:1fr}.top{padding:12px 20px}}
@media(max-width:640px){.shell{display:block}.side{display:none}.top{position:relative;padding:12px 14px;flex-wrap:wrap}.top .toolbar{width:100%}.top select{flex:1;min-width:0}.wrap{padding:16px 14px calc(98px + env(safe-area-inset-bottom));gap:16px}.panel{padding:14px}.grid2{grid-template-columns:1fr}.metric b{font-size:26px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:3;justify-content:space-around}.mobile button{border:0;padding:6px 4px;flex:1;min-width:0;background:transparent;font-size:11px;display:grid;place-items:center;gap:2px}.mobile button.active{background:var(--soft)}.mobile .symbol{font-size:20px}.cal{gap:3px}.cal button{min-height:52px;padding:4px;font-size:12px}.dot{font-size:10px}.actions button{flex:1}.item{align-items:flex-start}.item>.toolbar{justify-content:flex-end}#toast:not(:empty){bottom:85px;right:12px;max-width:calc(100vw - 24px)}}
</style></head>
<body><a href="#content" class="skip">К содержанию</a>
<div class="shell"><aside class="side"><div class="brand"><span class="mark" aria-hidden="true">≋</span>crosspost</div><nav class="nav" id="nav" aria-label="Основное меню"></nav><div class="foot muted"><small>UX 2.0 · демонстрация<br>Никаких реальных отправок</small></div></aside>
<main class="main" id="content"><header class="top"><div class="brand"><span class="mark" aria-hidden="true">≋</span><span>crosspost</span></div><div class="toolbar"><label for="role" class="muted">Роль</label><select id="role" aria-label="Роль демонстрации"><option value="client">Клиент</option><option value="admin">Администратор</option></select><select id="profile" aria-label="Профиль" hidden><option value="studio">Мастерская (демо)</option><option value="yoga">Студия йоги (демо)</option></select><button id="theme" aria-label="Переключить тему">Тема: светлая</button></div></header><div class="wrap" id="view"></div></main></div>
<nav id="mobile" class="mobile" aria-label="Мобильное меню"></nav><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const targets=[{id:"tg",name:"Telegram",detail:"Новости студии",tag:"TG"},{id:"vk",name:"ВКонтакте",detail:"Сообщество",tag:"VK"},{id:"ig",name:"Instagram",detail:"Профиль",tag:"IG"},{id:"ya",name:"Яндекс",detail:"Площадка",tag:"Я"}];
const status={scheduled:["◷","Запланировано",""],pending:["◷","На проверке","warn"],done:["✓","Опубликовано","good"],submitted:["?","Отправлено без подтверждения","warn"],failed:["!","Не опубликовано","bad"],partial:["!","Частично","warn"],rejected:["×","Отклонено","bad"],cancelled:["×","Отменено",""],unknown:["?","Результат неизвестен","warn"],relogin:["!","Нужен повторный вход","bad"]};
const date0="2026-11-24";
let seq=100,role="client",profile="studio",page="home",filter="all",query="",mode="week",selectedDate=date0,month=10,year=2026,weekStart="2026-11-23",theme="light",scenario="normal",notice="",toastTimer=0;
let posts=[
{id:1,profile:"studio",text:"Открытая встреча в Мастерской",date:"2026-11-24",time:"18:00",status:"scheduled",targets:["tg","vk"]},
{id:2,profile:"studio",text:"Анонс практики в воскресенье",date:"2026-11-25",time:"10:00",status:"pending",targets:["tg","ig"]},
{id:3,profile:"studio",text:"Итоги недели",date:"2026-11-23",time:"12:00",status:"partial",targets:["tg","vk","ig"],outcomes:{tg:"done",vk:"submitted",ig:"failed"}},
{id:4,profile:"studio",text:"Фото с мероприятия",date:"2026-11-23",time:"09:00",status:"done",targets:["tg"],outcomes:{tg:"done"}},
{id:5,profile:"studio",text:"Новый анонс",date:"2026-11-26",time:"15:00",status:"rejected",targets:["tg"],reason:"Уточните дату мероприятия."},
{id:6,profile:"yoga",text:"Утренняя практика йоги",date:"2026-11-27",time:"07:00",status:"scheduled",targets:["tg"]},
{id:7,profile:"yoga",text:"Расписание занятий",date:"2026-11-24",time:"13:00",status:"pending",targets:["tg","vk"]}];
const drafts=new Map(), connections={studio:{tg:"live",vk:"live",ig:"relogin",ya:"live"},yoga:{tg:"live",vk:"live",ig:"relogin",ya:"live"}};
const own=()=>posts.filter(p=>p.profile===profile);
const key=()=>role+":"+profile;
const fresh=()=>({text:"",media:"",kind:"none",targets:[],when:"later",date:selectedDate,time:"18:00",id:null});
const draft=()=>{if(!drafts.has(key()))drafts.set(key(),fresh());return drafts.get(key())};
const names={studio:"Мастерская",yoga:"Студия йоги"};
const navs=()=>role==="admin"?[["home","⌂","Обзор"],["calendar","▦","Контент-план"],["posts","☷","Публикации"],["moderation","✓","Модерация"],["clients","♙","Клиенты"],["connections","↔","Подключения"],["more","⋯","Ещё"]]:[["home","⌂","Главная"],["calendar","▦","Календарь"],["posts","☷","Публикации"],["more","⋯","Ещё"]];
const showStatus=s=>{const a=status[s]||status.unknown;return '<span class="status '+a[2]+'"><span aria-hidden="true">'+a[0]+'</span>'+a[1]+'</span>'};
const button=(label,action,cls="")=>'<button type="button" class="'+cls+'" data-action="'+action+'">'+label+'</button>';
const heading=(title,sub,action="")=>'<div class="row spread"><div><small>'+esc(sub)+'</small><h1>'+esc(title)+'</h1></div>'+action+'</div>';
const dateStr=d=>new Date(d+"T12:00:00Z").toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});
const iso=(y,m,d)=>new Date(Date.UTC(y,m,d)).toISOString().slice(0,10);
const shift=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function toast(s){$("toast").textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").textContent="",3500)}
function go(p){page=p;notice="";render();$("content").focus?.();window.scrollTo(0,0)}
function showDialog(title,body){$("dialog-body").innerHTML='<div class="stack"><div class="row spread"><h2 id="dialog-title">'+esc(title)+'</h2>'+button("Закрыть","close","subtle")+'</div>'+body+'</div>';$("dialog").showModal()}
function card(p){return '<div class="item"><div><small>'+dateStr(p.date)+' · '+esc(p.time)+' · '+esc(names[p.profile])+'</small><h3>'+esc(p.text||"Без текста")+'</h3>'+showStatus(p.status)+'<div class="muted"><small>'+esc(p.targets.map(t=>targets.find(x=>x.id===t)?.name||t).join(" · "))+'</small></div></div>'+button("Детали","detail:"+p.id,"subtle")+'</div>'}
function renderNav(){const ns=navs();$("nav").innerHTML=ns.map(n=>button('<span aria-hidden="true">'+n[1]+'</span> '+n[2],"go:"+n[0],page===n[0]?"active":"")).join("");const ms=role==="admin"?ns.filter(n=>["home","calendar","posts","moderation","more"].includes(n[0])):ns;$("mobile").innerHTML=ms.map(n=>button('<span class="symbol" aria-hidden="true">'+n[1]+'</span>'+n[2],"go:"+n[0],page===n[0]?"active":"")).join("");document.querySelectorAll("nav button").forEach(b=>{if(b.classList.contains("active"))b.setAttribute("aria-current","page")});$("profile").hidden=role!=="admin";$("theme").textContent="Тема: "+(theme==="dark"?"тёмная":"светлая")}
function home(){const p=own();const metrics=[["Опубликовано",p.filter(x=>x.status==="done").length],["Запланировано",p.filter(x=>x.status==="scheduled").length],["На проверке",p.filter(x=>x.status==="pending").length],["Требуют внимания",p.filter(x=>["partial","failed","submitted","unknown","rejected"].includes(x.status)).length]];return heading(role==="admin"?"Рабочее пространство":"Ваш контент",names[profile]+" · 24 ноября, демонстрация",button("+ Создать пост","new","primary"))+'<div class="metrics">'+metrics.map(m=>'<div class="panel metric"><small>'+m[0]+'</small><b>'+m[1]+'</b></div>').join("")+'</div><div class="grid2"><section class="panel stack"><div class="row spread"><h2>Ближайшие публикации</h2>'+button("Календарь","go:calendar","subtle")+'</div>'+ (p.filter(x=>["scheduled","pending"].includes(x.status)).sort((a,b)=>a.date.localeCompare(b.date)).map(card).join("")||'<p class="empty">Пока ничего не запланировано</p>')+'</section><section class="panel stack"><h2>Требуют внимания</h2>'+p.filter(x=>["partial","failed","submitted","unknown","rejected"].includes(x.status)).map(card).join("")+'<div class="notice">Instagram: нужен повторный вход. '+button("Подключения","go:connections")+'</div></section></div>'}
function eligible(t,d){return connections[profile][t.id]==="live"&&!(d.kind==="video"&&t.id==="ya")}
function editor(){const d=draft(),allowed=targets.filter(t=>eligible(t,d));return heading(d.id?"Редактирование":"Новая публикация",names[profile]+" · "+(d.text||d.media?"Черновик в этой демо-сессии":"Черновик"),button("К публикациям","go:posts","subtle"))+'<div class="editor"><section class="panel stack"><label for="post-text">Текст публикации</label><textarea id="post-text" placeholder="Напишите текст поста…">'+esc(d.text)+'</textarea><small id="count">'+d.text.length+' символов</small><div class="row spread"><h3>Медиа</h3>'+button("Выбрать из демо-медиатеки","pick-demo")+'</div><label for="file">Выбрать файл (только имя, без загрузки)</label><input id="file" type="file" accept="image/*,video/*"><div class="file">'+(d.media?esc(d.media)+" "+button("Убрать","clear-media","subtle"):"<small>Нет вложения</small>")+'</div><div class="notice">Файл никуда не передаётся. Данные только в памяти этой вкладки.</div></section><section class="panel stack"><div class="row spread"><h2>Площадки</h2><small>'+d.targets.length+' выбрано</small></div>'+targets.map(t=>'<label class="target '+(eligible(t,d)?"":"disabled")+'"><span class="avatar">'+t.tag+'</span><span>'+t.name+'<br><small>'+esc(eligible(t,d)?t.detail:connections[profile][t.id]!=="live"?"Нужен повторный вход":"Видео недоступно")+'</small></span><input type="checkbox" data-target="'+t.id+'" '+(d.targets.includes(t.id)?"checked":"")+' '+(eligible(t,d)?"":"disabled")+'></label>').join("")+'<div class="row">'+button("Выбрать доступные","all-targets","subtle")+button("Снять выбор","no-targets","subtle")+'</div><label>Когда<select id="when"><option value="now" '+(d.when==="now"?"selected":"")+'>Сейчас</option><option value="later" '+(d.when==="later"?"selected":"")+'>По расписанию</option></select></label>'+(d.when==="later"?'<div class="grid2"><label>Дата<input type="date" id="date" value="'+esc(d.date)+'"></label><label>Время<input type="time" id="time" value="'+esc(d.time)+'"></label></div><small>Часовой пояс демонстрации: Europe/Moscow</small>':'')+(role==="client"&&profile==="studio"?'<div class="notice">Для этого профиля обязательна проверка администратором.</div>':'')+(notice?'<div role="alert" class="error">'+esc(notice)+'</div>':'')+'<div class="actions">'+button("Предпросмотр","preview")+button(role==="client"&&profile==="studio"?"На проверку":d.id?"Сохранить":d.when==="now"?"Опубликовать (демо)":"Запланировать","submit","primary")+'</div></section></div>'}
function publications(){const visible=own().filter(p=>(filter==="all"||filter==="attention"&&["partial","failed","submitted","unknown","rejected","relogin"].includes(p.status)||filter===p.status)&&p.text.toLowerCase().includes(query.toLowerCase()));return heading("Публикации",names[profile],button("+ Создать пост","new","primary"))+'<section class="panel stack"><label>Поиск<input id="search" value="'+esc(query)+'" placeholder="Поиск по тексту"></label><div class="chips">'+[["all","Все"],["scheduled","Запланировано"],["pending","На проверке"],["done","Опубликовано"],["attention","Требуют внимания"]].map(a=>button(a[1],"filter:"+a[0],"chip "+(filter===a[0]?"active":""))).join("")+'</div>'+(scenario==="read-error"?'<div class="error" role="alert">Не удалось загрузить публикации. Это не пустой список. '+button("Повторить загрузку","retry-read")+'</div>':visible.map(card).join("")||'<div class="empty">Нет публикаций по этим фильтрам.</div>')+'</section><section class="panel row spread"><div><h3>Черновик текущей сессии</h3><small>'+esc(draft().text||"Нет текста")+'</small></div>'+button("Открыть редактор","go:editor")+'</section>'}
function calendar(){let ds=[];if(mode==="month"){const start=(new Date(Date.UTC(year,month,1)).getUTCDay()+6)%7;const max=new Date(Date.UTC(year,month+1,0)).getUTCDate();ds=[...Array(start).fill(null),...Array.from({length:max},(_,i)=>iso(year,month,i+1))]}else ds=Array.from({length:7},(_,i)=>shift(weekStart,i));const list=own().filter(p=>mode==="list"?["scheduled","pending"].includes(p.status):p.date===selectedDate).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return heading("Контент-план",names[profile]+" · Europe/Moscow",button("+ Создать пост","new","primary"))+'<section class="panel stack"><div class="row spread"><h2>'+new Date(Date.UTC(year,month,1)).toLocaleDateString("ru-RU",{month:"long",year:"numeric",timeZone:"UTC"})+'</h2><div class="toolbar">'+button("←","cal-prev")+button("Сегодня (демо)","cal-today")+button("→","cal-next")+'</div></div><div class="chips">'+[["week","Неделя"],["month","Месяц"],["list","Список"]].map(a=>button(a[1],"mode:"+a[0],mode===a[0]?"active":"")).join("")+'</div>'+(mode==="list"?"":'<div class="cal">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(s=>'<div class="daylabel">'+s+'</div>').join("")+ds.map(d=>d?button(Number(d.slice(-2))+'<span class="dot">'+(own().filter(p=>p.date===d).length||"")+'</span>',"date:"+d,selectedDate===d?"active":""):'<div class="blank"></div>').join("")+'</div>')+'</section><section class="panel stack"><div class="row spread"><h2>'+ (mode==="list"?"Ближайшие":dateStr(selectedDate))+'</h2>'+button("+ На эту дату","new-date")+'</div>'+(list.map(card).join("")||'<p class="empty">На этот день нет публикаций</p>')+'</section>'}
function moderation(){if(role!=="admin")return home();const p=posts.filter(x=>x.status==="pending");return heading("Модерация","Все демонстрационные клиенты")+'<section class="panel stack">'+(p.map(card).join("")||'<p class="empty">Нет публикаций на проверке</p>')+'</section>'}
function clients(){if(role!=="admin")return home();return heading("Клиенты","Управление профилями · демо")+'<section class="panel">'+Object.keys(names).map(k=>'<div class="item"><div><h3>'+names[k]+'</h3><small>'+posts.filter(p=>p.profile===k&&p.status==="pending").length+' на проверке · '+posts.filter(p=>p.profile===k).length+' публикаций</small></div>'+button("Открыть","client:"+k)+'</div>').join("")+'</section>'}
function connectionView(){return heading("Подключения",names[profile])+'<section class="panel stack">'+targets.map(t=>'<div class="item"><div><span class="platform"><span class="avatar">'+t.tag+'</span><b>'+t.name+'</b></span><br><small>'+ (connections[profile][t.id]==="live"?"Подключён":"Нужен повторный вход")+'</small></div>'+(role==="admin"?button(connections[profile][t.id]==="live"?"Проверить (демо)":"Переподключить (демо)","connect:"+t.id):'<small>Управляет администратор</small>')+'</div>').join("")+'</section>'}
function more(){return heading("Ещё","Настройки и демо-сценарии")+'<div class="grid2"><section class="panel stack"><h2>Рабочие инструменты</h2>'+button("Подключения","go:connections")+ (role==="admin"?button("Клиенты","go:clients")+button("Модерация","go:moderation")+button("Импорт плана (путь)","go:import"):"")+button("Медиатека (демо)","go:media")+'</section><section class="panel stack"><h2>Проверить сценарий</h2><label>Состояние демонстрации<select id="scenario">'+[["normal","Обычный результат"],["read-error","Ошибка чтения"],["mixed","Частичный результат"],["unknown","Потеря ответа при отправке"]].map(a=>'<option value="'+a[0]+'" '+(scenario===a[0]?"selected":"")+'>'+a[1]+'</option>').join("")+'</select></label><small>Сценарии не выполняют сетевых запросов.</small>'+button("Сбросить демо","reset","danger")+'</section></div>'}
function media(){return heading("Медиатека","Демонстрационные файлы")+'<div class="grid2">'+["Афиша.jpg","Практика.mp4","Логотип.png"].map((n,i)=>'<section class="panel stack"><div style="background:var(--soft);min-height:100px;display:grid;place-items:center;border-radius:10px;font-size:28px" aria-hidden="true">'+(i===1?"▷":"▧")+'</div><h3>'+n+'</h3>'+button("В черновик","media:"+i)+'</section>').join("")+'</div>'}
function importView(){return heading("Импорт контент-плана","Демонстрация будущего маршрута")+'<section class="panel stack"><h2>1. Источник → 2. Сопоставление → 3. Проверка</h2><p>Существующий импорт Google Sheets, XLSX и CSV будет сохранён. В UX-00 файлы не разбираются и записи не создаются.</p>'+button("К контент-плану","go:calendar")+'</section>'}
function render(){renderNav();const f={home,editor,posts:publications,calendar,moderation,clients,connections:connectionView,more,media,import:importView}[page]||home;$("view").innerHTML='<div class="banner">Демонстрационный прототип · вымышленные данные · никаких реальных отправок</div>'+f()}
function details(p){if(!p||role==="client"&&p.profile!==profile)return;let body='<small>'+esc(names[p.profile])+' · '+dateStr(p.date)+' · '+esc(p.time)+'</small>'+showStatus(p.status)+'<div class="detail preview">'+esc(p.text)+'</div>';if(p.reason)body+='<div class="notice">'+esc(p.reason)+'</div>';body+=p.targets.map(t=>'<div class="row spread"><span>'+esc(targets.find(x=>x.id===t)?.name||t)+'</span>'+showStatus(p.outcomes?.[t]||p.status)+'</div>').join("");if(p.status==="scheduled"&&p.profile===profile)body+='<div class="actions">'+button("Изменить","edit:"+p.id)+button("Отменить пост","cancel-confirm:"+p.id,"danger")+'</div>';if(p.status==="pending"&&role==="admin")body+='<label>Причина отклонения<textarea id="reason" rows="2" placeholder="Укажите, что исправить"></textarea></label><div class="actions">'+button("Отклонить","reject:"+p.id,"danger")+button("Одобрить","approve:"+p.id,"primary")+'</div>';if(["submitted","partial","unknown"].includes(p.status))body+='<div class="notice">Неподтверждённая отправка не считается успехом. Повтор недоступен.</div>';showDialog("Публикация",body)}
function setMedia(n,kind){const d=draft();d.media=n;d.kind=kind;const before=d.targets.length;d.targets=d.targets.filter(id=>eligible(targets.find(t=>t.id===id),d));if(before!==d.targets.length)toast("Недоступная цель снята. Новые цели не добавлены.");render()}
function submit(){const d=draft();if(!d.text.trim()&&!d.media){notice="Добавьте текст или медиа.";render();return}if(!d.targets.length){notice="Выберите хотя бы одну площадку.";render();return}if(d.when==="later"&&(!d.date||!d.time||(d.date<date0||d.date===date0&&d.time<"12:00"))){notice="Укажите допустимые дату и время.";render();return}if(d.id&&d.when!=="later"){notice="При редактировании расписания выберите дату и время.";render();return}if(d.id&&!own().some(p=>p.id===d.id&&p.status==="scheduled")){notice="Пост уже изменился. Откройте его заново.";render();return}const pending=role==="client"&&profile==="studio";let st=pending?"pending":d.when==="later"?"scheduled":"done",outcomes;if(st==="done"){outcomes=Object.fromEntries(d.targets.map((t,i)=>[t,scenario==="unknown"?"unknown":scenario==="mixed"?i===0?"submitted":i===1?"failed":"done":"done"]));if(scenario==="unknown")st="unknown";else if(scenario==="mixed")st=d.targets.length===1?"submitted":"partial"}const p={id:d.id||++seq,profile,text:d.text,date:d.when==="later"?d.date:date0,time:d.when==="later"?d.time:"12:00",status:st,targets:[...d.targets],media:d.media,outcomes};posts=d.id?posts.map(x=>x.id===d.id?p:x):[p,...posts];drafts.delete(key());filter="all";query="";scenario="normal";go("posts");details(p);toast("Демонстрация: "+status[st][1])}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const [a,v]=b.dataset.action.split(":");const p=posts.find(x=>x.id===Number(v));switch(a){case"go":go(v);break;case"new":go("editor");break;case"new-date":draft().date=selectedDate;draft().when="later";go("editor");break;case"close":$("dialog").close();break;case"detail":details(p);break;case"filter":filter=v;render();break;case"mode":mode=v;render();break;case"date":selectedDate=v;render();break;case"cal-prev":case"cal-next":{const n=a==="cal-prev"?-1:1;if(mode==="month"){const x=new Date(Date.UTC(year,month+n,1));year=x.getUTCFullYear();month=x.getUTCMonth();selectedDate=iso(year,month,1)}else{weekStart=shift(weekStart,n*7);selectedDate=weekStart;const x=new Date(weekStart+"T12:00:00Z");year=x.getUTCFullYear();month=x.getUTCMonth()}render();break}case"cal-today":year=2026;month=10;weekStart="2026-11-23";selectedDate=date0;render();break;case"all-targets":draft().targets=targets.filter(t=>eligible(t,draft())).map(t=>t.id);render();break;case"no-targets":draft().targets=[];render();break;case"clear-media":setMedia("","none");break;case"pick-demo":go("media");break;case"media":setMedia(["Афиша.jpg","Практика.mp4","Логотип.png"][Number(v)],v==="1"?"video":"image");go("editor");break;case"preview":showDialog("Приблизительный предпросмотр",'<div class="detail preview">'+esc(draft().text||"Нет текста")+'</div><small>'+esc(draft().media)+'</small><p>Выбрано площадок: '+draft().targets.length+'</p><small>Внешний вид на реальных площадках может отличаться.</small>');break;case"submit":submit();break;case"edit":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();drafts.set(key(),{text:p.text,media:p.media||"",kind:p.media?.endsWith(".mp4")?"video":"none",targets:[...p.targets],when:"later",date:p.date,time:p.time,id:p.id});go("editor")}break;case"cancel-confirm":if(p&&p.profile===profile&&p.status==="scheduled"){$("dialog").close();showDialog("Отменить публикацию?",'<p>Пост не будет отправлен (демо).</p>'+button("Подтвердить отмену","cancel:"+p.id,"danger"))}break;case"cancel":if(p&&p.profile===profile&&p.status==="scheduled"){p.status="cancelled";$("dialog").close();render();toast("Пост отменён (демо)")}break;case"approve":case"reject":if(role==="admin"&&p?.status==="pending"){if(a==="reject"&&!$("reason").value.trim()){toast("Укажите причину отклонения");break}p.status=a==="approve"?"scheduled":"rejected";if(a==="reject")p.reason=$("reason").value.trim();$("dialog").close();render();toast("Решение сохранено (демо)")}break;case"client":if(role==="admin"&&names[v]){profile=v;$("profile").value=v;go("home")}break;case"connect":if(role==="admin"&&connections[profile][v]){connections[profile][v]="live";render();toast("Демонстрационная проверка выполнена")}break;case"retry-read":scenario="normal";render();break;case"reset":location.reload();break;}});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="post-text"){draft().text=el.value;$("count").textContent=el.value.length+" символов"}if(el.id==="search"){query=el.value;const pos=el.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const el=e.target;if(el.id==="role"){role=el.value;profile=role==="client"?"studio":$("profile").value;filter="all";query="";go("home")}else if(el.id==="profile"&&role==="admin"){profile=el.value;filter="all";query="";go("home")}else if(el.id==="file"){const f=el.files[0];if(f)setMedia(f.name,f.type.startsWith("video/")?"video":"image")}else if(el.dataset.target){const d=draft(),id=el.dataset.target;if(el.checked&&eligible(targets.find(t=>t.id===id),d))d.targets=[...new Set([...d.targets,id])];else d.targets=d.targets.filter(x=>x!==id);render();document.querySelector('[data-target="'+id+'"]')?.focus()}else if(["when","date","time"].includes(el.id)){draft()[el.id]=el.value;if(el.id==="when"){if(draft().id&&el.value==="now"){draft().when="later";toast("Для существующего поста доступно только изменение расписания.")}render()}}else if(el.id==="scenario"){scenario=el.value;toast("Сценарий выбран")}});
$("theme").addEventListener("click",()=>{theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;renderNav()});render();
</script></body></html>
